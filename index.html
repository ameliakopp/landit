<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CLOCKED</title>
<meta name="theme-color" content="#0A0A0B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CLOCKED">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="The internship quiz that tells you the truth. Get your archetype, your clarity score, and the careers you're actually built for.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap">
<style>
:root{
  --bg:#0A0A0B;--ink:#F3F1ED;--mute:rgba(243,241,237,.56);--faint:rgba(243,241,237,.34);
  --glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.1);--edge:rgba(255,255,255,.13);
  --a1:#FF6A2B;--a2:#FF3D7F;--a3:#8B5CFF;
  --sans:"Inter Tight",system-ui,-apple-system,sans-serif;
}
.t-career{--a1:#3DD6C6;--a2:#4B7BFF;--a3:#B36BFF}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}

/* ambient glow */
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.amb i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.amb i:nth-child(1){width:70vmax;height:70vmax;left:-25vmax;top:-35vmax;background:radial-gradient(circle,var(--a1),transparent 62%)}
.amb i:nth-child(2){width:60vmax;height:60vmax;right:-30vmax;top:10vh;background:radial-gradient(circle,var(--a2),transparent 62%);animation-delay:-6s;opacity:.35}
.amb i:nth-child(3){width:60vmax;height:60vmax;left:-10vmax;bottom:-45vmax;background:radial-gradient(circle,var(--a3),transparent 62%);animation-delay:-12s;opacity:.3}
.amb.dim i{opacity:.22}
@keyframes drift{to{transform:translate(4vmax,3vmax) scale(1.08)}}
.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;max-width:640px;width:100%;margin:0 auto}
.word{font-weight:500;font-size:21px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.mark{width:22px;height:22px;opacity:.9}
.circ{width:42px;height:42px;border-radius:50%;background:var(--glass);border:1px solid var(--edge);display:grid;place-items:center;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:17px;overflow:hidden;flex:none}
.circ img{width:100%;height:100%;object-fit:cover}
.chipc{padding:7px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);font-size:13px;color:var(--ink);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-variant-numeric:tabular-nums}

/* layout */
.screen{flex:1;width:100%;max-width:560px;margin:0 auto;padding:8px 22px 130px;display:flex;flex-direction:column}
.center{justify-content:center;align-items:center;text-align:center}
.kick{font-size:13px;color:var(--mute);margin:0 0 12px;letter-spacing:.01em}
.t1{font-weight:400;font-size:clamp(34px,8.6vw,48px);line-height:1.06;letter-spacing:-.035em;margin:0 0 14px}
.t1 b{font-weight:600}
.t2{font-size:17px;color:var(--mute);margin:0 0 30px;max-width:34ch}
.stack{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:999px;padding:17px 22px;font-size:16px;font-weight:500;background:var(--ink);color:#0A0A0B;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.glass{background:var(--glass);color:var(--ink);border:1px solid var(--edge);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.btn.li{background:#fff}
.btn.li svg{width:20px;height:20px}
.btn[disabled]{opacity:.35;pointer-events:none}
.txt{background:none;border:0;padding:8px;color:var(--mute);font-size:14px}
.txt:hover{color:var(--ink)}

/* orb */
.orb{position:relative;width:min(58vw,240px);aspect-ratio:1;border-radius:50%;margin:0 auto 34px;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75),transparent 28%),radial-gradient(circle at 70% 70%,var(--a3),transparent 60%),radial-gradient(circle at 30% 75%,var(--a2),transparent 55%),radial-gradient(circle at 60% 30%,var(--a1),transparent 60%),#2a1a2a;
  box-shadow:0 0 90px -10px var(--a2),inset 0 0 40px rgba(255,255,255,.25);animation:breathe 5s ease-in-out infinite}
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.18),transparent 40%);animation:spin 9s linear infinite;mix-blend-mode:overlay}
.orb.sm{width:120px;margin-bottom:22px}
.orb.busy{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05);filter:saturate(1.2) brightness(1.08)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* quiz */
.qhead{display:flex;flex-direction:column;gap:10px;margin:18px 0 26px}
.qlabel{font-size:13px;color:var(--mute)}
.qq{font-weight:400;font-size:clamp(30px,7.4vw,40px);line-height:1.12;letter-spacing:-.03em;margin:0;text-wrap:balance}
.react{font-size:14px;color:var(--ink);opacity:.8;margin:0;padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);align-self:flex-start;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);animation:fade .4s both}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles.one-col{grid-template-columns:1fr}
.tile{position:relative;text-align:left;border-radius:26px;border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:16px 18px 18px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;font-size:16px;line-height:1.25;font-weight:400;color:var(--ink);transition:background .2s,color .2s,transform .15s,box-shadow .2s}
.tiles.one-col .tile{min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;padding:18px 20px}
.tile .k{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.tile:active{transform:scale(.98)}
.tile[aria-pressed="true"]{background:rgba(255,255,255,.92);color:#0A0A0B;box-shadow:0 0 40px -6px var(--a2)}
.tile[aria-pressed="true"] .k{color:rgba(0,0,0,.45)}
.qtext{width:100%;min-height:130px;border-radius:24px;border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:var(--ink);font:inherit;font-size:18px;padding:18px;resize:none}
.qtext::placeholder{color:var(--faint)}
.qtext:focus{outline:none;border-color:rgba(255,255,255,.35)}
.pairs{display:flex;flex-direction:column;gap:10px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.pair>span{font-size:12px;color:var(--faint)}
.pair .tile{min-height:64px;justify-content:center;text-align:center;align-items:center;padding:14px}
.rate{display:flex;flex-direction:column;gap:10px}
.rate-row{border-radius:24px;border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:16px;display:flex;flex-direction:column;gap:12px}
.rate-row>b{font-weight:400;font-size:16px;line-height:1.35}
.rate-b{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rate-b button{border-radius:999px;border:1px solid var(--edge);background:transparent;padding:9px 4px;font-size:13px;color:var(--mute)}
.rate-b button[aria-pressed="true"]{background:var(--ink);color:#0A0A0B;border-color:var(--ink)}
.qfoot{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:14px 22px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(10,10,11,.95) 55%,transparent)}
.qfoot .in{max-width:516px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.qfoot .cnt{font-size:13px;color:var(--mute)}
.go{display:flex;align-items:center;gap:12px;margin-left:auto;background:none;border:0;padding:0;font-size:15px;color:var(--mute)}
.go i{width:56px;height:56px;border-radius:50%;background:var(--ink);color:#0A0A0B;display:grid;place-items:center;font-style:normal;font-size:20px;transition:transform .15s,opacity .2s}
.go[disabled]{opacity:.35;pointer-events:none}
.go:active i{transform:scale(.94)}
.anim-in{animation:fade .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* loading */
.loadpill{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);font-size:13px;margin-bottom:14px}
.loadpill i{width:8px;height:8px;border-radius:50%;background:var(--ink);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}

/* score ring */
.ring{position:relative;width:min(70vw,260px);aspect-ratio:1;margin:10px auto 26px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .trk{fill:none;stroke:rgba(255,255,255,.08);stroke-width:10}
.ring .val{fill:none;stroke:url(#rg);stroke-width:10;stroke-linecap:round;filter:drop-shadow(0 0 14px var(--a1));animation:ringin 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringin{from{stroke-dashoffset:var(--full)}}
.ring .glow{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle,var(--a1),transparent 68%);opacity:.32;filter:blur(18px)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-weight:300;font-size:clamp(64px,17vw,88px);line-height:1;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.ring .num span{font-size:12px;color:var(--mute);margin-top:6px}
.verdict{font-size:20px;line-height:1.3;margin:0 0 4px;letter-spacing:-.02em}
.verdict+p{color:var(--mute);margin:0}
.sec{margin-top:34px;text-align:left;width:100%}
.sec h3{font-size:13px;font-weight:400;color:var(--mute);margin:0 0 12px}
.gcard{border-radius:28px;border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:18px}
.persona{display:flex;gap:16px;align-items:center;padding:12px}
.persona img{width:96px;height:96px;border-radius:22px;object-fit:cover;object-position:50% 25%;flex:none}
.persona b{display:block;font-weight:500;font-size:22px;letter-spacing:-.02em;line-height:1.15}
.persona span{font-size:14px;color:var(--mute)}
.body{font-size:16.5px;line-height:1.6;color:rgba(243,241,237,.82);margin:14px 4px 0}
.moves{list-style:none;margin:0;padding:6px 0}
.moves li{display:flex;gap:16px;align-items:baseline;padding:14px 18px;font-size:17px}
.moves li+li{border-top:1px solid var(--edge)}
.moves li span{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;min-width:18px}
.alt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;font-size:16.5px}
.alt+.alt{border-top:1px solid var(--edge)}
.alt em{font-style:normal;color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.alt button{font-size:13px}
.searchpill{display:inline-flex;gap:6px;padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);font-size:13.5px;color:var(--mute);margin-top:14px}
.searchpill b{color:var(--ink);font-weight:500}

/* forms / setup */
.field{display:flex;flex-direction:column;gap:6px;text-align:left}
.field label{font-size:12.5px;color:var(--mute)}
.in{width:100%;border-radius:18px;border:1px solid var(--edge);background:var(--glass);color:var(--ink);padding:14px 16px;font:inherit;font-size:16px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:rgba(255,255,255,.35)}
textarea.in{min-height:120px;resize:vertical}
.msg{font-size:14px;line-height:1.5;padding:12px 16px;border-radius:18px;background:var(--glass);border:1px solid var(--edge);margin:0;text-align:left}
.msg.err{border-color:rgba(255,90,90,.5)}
.or{font-size:12px;color:var(--faint);margin:6px 0}
details summary{list-style:none;cursor:pointer}details summary::-webkit-details-marker{display:none}
.drop{position:relative;width:min(62vw,230px);aspect-ratio:1;border-radius:50%;margin:0 auto 26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;border:1px dashed rgba(255,255,255,.3);background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.1),transparent 70%);cursor:pointer;transition:transform .2s,border-color .2s}
.drop::before{content:"";position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,var(--a2),transparent 65%);opacity:.25;filter:blur(20px);z-index:-1}
.drop:hover,.drop.over{transform:scale(1.03);border-color:rgba(255,255,255,.6)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;border-radius:50%}
.drop b{font-weight:500;font-size:18px}
.drop span{font-size:13px;color:var(--mute);max-width:16ch}
.drop.done{border-style:solid;border-color:rgba(255,255,255,.4)}
.found{text-align:left;width:100%}
.found .alt b{font-weight:500}
.xp{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.xp .in{padding:11px 14px;font-size:15px}
.xp .rm{width:40px;height:40px;border-radius:50%;border:1px solid var(--edge);background:var(--glass)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}.xp{grid-template-columns:1fr auto}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--edge);background:var(--glass);font-size:13px;color:var(--ink)}
.avatar{width:88px;height:88px;border-radius:50%;margin:0 auto 14px;border:1px solid var(--edge);background:var(--glass);display:grid;place-items:center;font-size:34px;font-weight:300;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.tiny{font-size:12px;color:var(--faint)}
.res2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.mini{border-radius:26px;border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px;color:var(--ink)}
.mini b{font-weight:300;font-size:44px;line-height:1;letter-spacing:-.04em}
.mini span{font-size:13px;color:var(--mute)}
.mini strong{font-weight:500;font-size:16px;line-height:1.2;margin-top:auto}

/* help */
.help-fab{position:fixed;right:16px;bottom:16px;z-index:30;width:42px;height:42px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);color:var(--mute);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:16px}
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.modal{width:100%;max-width:440px;background:#151517;border:1px solid var(--edge);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:12px}
.modal h2{font-weight:400;font-size:28px;letter-spacing:-.03em;margin:0}
.modal .chip[aria-pressed="true"]{background:var(--ink);color:#0A0A0B}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:#1c1c1f;border:1px solid var(--edge);color:var(--ink);font-size:14px;padding:12px 18px;border-radius:999px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ================= CLOCKED ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const listJoin=a=>a.length<2?a.join(""):a.slice(0,-1).join(", ")+" and "+a[a.length-1];
const YEAR=new Date().getFullYear();
const XSVG=`<svg class="x" viewBox="0 0 100 100" aria-hidden="true"><path d="M18 20 Q50 55 84 86M82 16 Q48 52 16 84" stroke="#FF2B1C" stroke-width="9" fill="none" stroke-linecap="round"/></svg>`;
const SCRIB=`<svg class="scrib" viewBox="0 0 200 100" preserveAspectRatio="none" aria-hidden="true"><path d="M20 52 C 18 18, 170 8, 186 44 C 198 78, 60 98, 22 70 C 8 58, 30 30, 70 24"/></svg>`;

/* ---------- state ---------- */
const STORE="clocked.v1";
function fresh(){return {v:"clocked1",profile:null,answers:{},results:{},draft:{}}}
let S=(()=>{try{const s=JSON.parse(localStorage.getItem(STORE));if(s&&s.v==="clocked1")return s}catch(e){}return fresh()})();
function save(){try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}cloudSave()}
const UI={msg:"",busy:false,mode:"signup",liOn:null,help:null,toast:null,parse:null};
function toast(t){UI.toast=t;render();clearTimeout(toast.t);toast.t=setTimeout(()=>{UI.toast=null;render()},2600)}

/* ---------- accounts (Supabase) ---------- */
const SUPABASE_URL="https://bzumycapvgqkejenexpq.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6dW15Y2Fwdmdxa2VqZW5leHBxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNDIxMTgsImV4cCI6MjEwODYxODExOH0.OgqQUbg5Iy7QBbF9MTdaxJdYGHOR9AfqCQDJvffdggw";
const sb=(window.supabase&&window.supabase.createClient)?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const AUTH={user:null};
function cloudSave(){if(!sb||!AUTH.user)return;clearTimeout(cloudSave.t);cloudSave.t=setTimeout(async()=>{
  const p=S.profile||{},row={id:AUTH.user.id,first_name:p.first||null,company:(p.experience&&p.experience[0]&&p.experience[0].company)||null,state:S,updated_at:new Date().toISOString()};
  const {error}=await sb.from("students").upsert(row);if(error)console.warn("Cloud save failed:",error.message)},700)}
async function cloudLoad(){const {data,error}=await sb.from("students").select("state").eq("id",AUTH.user.id).maybeSingle();
  if(error){console.warn("Cloud load failed:",error.message);return}
  if(data&&data.state&&data.state.v==="clocked1"){S=data.state;try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}}else cloudSave()}
function metaProfile(u){const m=(u&&u.user_metadata)||{},name=m.full_name||m.name||[m.given_name,m.family_name].filter(Boolean).join(" ")||"";
  return {name,first:(m.given_name||name.split(" ")[0]||"").trim(),email:u.email||m.email||"",avatar:m.avatar_url||m.picture||"",linkedin:(u.app_metadata&&(u.app_metadata.provider==="linkedin_oidc"||(u.app_metadata.providers||[]).includes("linkedin_oidc")))||false}}
async function setUser(u){const was=AUTH.user&&AUTH.user.id;AUTH.user=u||null;
  if(AUTH.user&&AUTH.user.id!==was){await cloudLoad();const mp=metaProfile(AUTH.user);
    S.profile=Object.assign({},mp,S.profile||{});["name","first","avatar"].forEach(k=>{if(!S.profile[k]&&mp[k])S.profile[k]=mp[k]});if(mp.linkedin)S.profile.linkedin=true;if(!S.profile.email)S.profile.email=mp.email;save();
    const r=route();if(r==="join"||r==="home"||/access_token|error_description|code=/.test(location.href))go(S.profile.done?(S.pending||"me"):"setup");else render()}
  else render()}
if(sb){sb.auth.getSession().then(({data})=>setUser(data.session&&data.session.user));
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==="SIGNED_OUT"){AUTH.user=null;render()}else if(s&&(!AUTH.user||AUTH.user.id!==s.user.id))setUser(s.user)})}

async function handleResume(file){if(!file)return;if(!/pdf$/i.test(file.type)&&!/\.pdf$/i.test(file.name)){UI.parse={err:"That’s not a PDF. Export your resume as a PDF, or paste the text below."};render();return}

const QLAB=Object.fromEntries([...QSAT,...QAREA,...QFOR,...QSKILL,...QKNOWN,...QVAL,...QIND,...QPAIRS.flatMap(p=>[[p[1],p[2]],[p[3],p[4]]])].map(([k,l])=>[k,l.toLowerCase()]));
function qWant(w){return [...[].concat(w.sat||[]),...[].concat(w.area||[]),...QPAIRS.map(x=>w[x[0]]),...[].concat(w.known||[]),...(w.qfor||[]),...(w.qval||[]),...(w.qskill||[])].filter(Boolean)}
function qScore(w,d){const want=qWant(w),ind=w.qind||[],no=w.qnot||[];let sc=0;const love=[];
  d.tags.forEach(t=>{if(want.includes(t))sc+=(w.qskill||[]).includes(t)?1.5:1});
  sc+=d.ind.filter(i=>ind.includes(i)).length*1.5;
  QTASKS.forEach(([k,label,ds])=>{if(!ds.includes(d.id))return;const r=w["r_"+k];if(r==="love"){sc+=3;love.push(label)}else if(r==="maybe")sc+=1;else if(r==="no")sc-=2.5});
  if(d.not.some(n=>no.includes(n)))sc-=5;
  const dr=String(w.dream||"").toLowerCase();if(dr&&(dr.includes(d.t.toLowerCase().split(/[ &]/)[0])||d.role.split(" ").some(x=>x.length>4&&x!=="intern"&&dr.includes(x))))sc+=3;
  return{sc,love}}
function qMatches(w,n){const all=DIRS.map(d=>{const r=qScore(w,d),hit=d.tags.filter(t=>qWant(w).includes(t));
    return{d,score:r.sc,loves:r.love.slice(0,2).map(l=>l.charAt(0).toLowerCase()+l.slice(1)),likes:hit.slice(0,2).map(t=>QLAB[t]).filter(Boolean),love:r.love.length}}).sort((a,b)=>b.score-a.score);
  const top=Math.max(1,all[0].score);all.forEach((x,i)=>x.pct=Math.max(40,Math.min(97,Math.round(96*x.score/top-(i?3:0)))));return all.slice(0,n||3)}

function resumeBoost(d){const p=S.profile||{},t=[p.resumeText||"",(p.experience||[]).map(x=>x.title+" "+x.company).join(" "),(p.skills||[]).join(" "),p.major||""].join(" ");const k=DIR_KW[d.id];return k&&k.test(t)?2:0}
function careerResult(w){const all=DIRS.map(d=>{const r=qScore(w,d),hit=d.tags.filter(t=>qWant(w).includes(t)),rb=resumeBoost(d);
    return{d,score:r.sc+rb,rb,loves:r.love.slice(0,2).map(l=>l.charAt(0).toLowerCase()+l.slice(1)),likes:hit.slice(0,2).map(t=>QLAB[t]).filter(Boolean)}}).sort((a,b)=>b.score-a.score);

function flatPairs(a){const w=Object.assign({},a);["pairs1","pairs2"].forEach(k=>Object.assign(w,a[k]||{}));["rate1","rate2","rate3"].forEach(k=>Object.entries(a[k]||{}).forEach(([t,v])=>w["r_"+t]=v));return w}

  else if(q.kind==="text")body=`<textarea class="qtext" id="qz-text" data-qtext placeholder="${esc(q.ph||"What do you think?")}">${esc(v||"")}</textarea>`;
  else if(q.kind==="pairs"){const cur=v||{};body=`<div class="pairs">${q.pairs.map(([pk,a1,l1,b1,l2])=>`<div class="pair"><button class="tile" data-act="pair" data-p="${pk}" data-v="${a1}" aria-pressed="${cur[pk]===a1}"><span>${esc(l1)}</span></button><span>or</span><button class="tile" data-act="pair" data-p="${pk}" data-v="${b1}" aria-pressed="${cur[pk]===b1}"><span>${esc(l2)}</span></button></div>`).join("")}</div>`}
  else if(q.kind==="rate"){const cur=v||{};body=`<div class="rate">${q.tasks.map(t=>`<div class="rate-row"><b>${esc(QT[t][1])}</b><div class="rate-b">${[["love","Love it"],["maybe","Maybe"],["no","No"]].map(([x,l])=>`<button data-act="rate" data-t="${t}" data-v="${x}" aria-pressed="${cur[t]===x}">${l}</button>`).join("")}</div></div>`).join("")}</div>`}
  const cnt=q.kind==="many"&&q.max?`<span class="cnt">${(v||[]).length} of ${q.max}</span>`:"";
  return shell(`<main class="screen qz-body anim-in" data-q="${q.id}">
      <div class="qhead">${d.react?`<p class="react">${esc(d.react)}</p>`:""}<span class="qlabel">${label}</span><h1 class="qq">${esc(q.q)}</h1></div>
      ${body}</main>
    <div class="qfoot qz-foot"><div class="in">${cnt}<button class="go btn-next" data-act="qnext" ${!ok&&!q.optional?"disabled":""}>${!ok&&q.optional?"Skip":last?"See my result":"Next"}<i>→</i></button></div></div>`,
    {theme:k,dim:true,top:`<span style="display:flex;gap:8px;align-items:center"><button class="circ" data-act="qback" aria-label="Back">←</button></span><span class="chipc">${idx+1}/${N}</span><button class="circ" data-act="qexit" aria-label="Close">×</button>`}).replace(WORD,'')}

function vLoading(k){return shell(`<main class="screen center"><div class="orb busy" aria-hidden="true"></div><span class="loadpill"><i></i>${k==="arch"?"Reading your answers":"Matching you"}</span><p class="t2" style="margin:0">${k==="arch"?"Turning your answers into a score.":"Comparing you against 24 career paths."}</p></main>`,{theme:k,bare:true})}

const VERDICT=["","You’re early. Most people start here.","You’re working hard, just aimed at everything.","You’re close. One good lead away.","You’re ahead of most students.","You’re ahead. Most people aren’t."];
function ring(val,label){const r=90,c=2*Math.PI*r,off=c*(1-val/100);
  return `<div class="ring"><div class="glow"></div><svg viewBox="0 0 200 200" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--a1)"/><stop offset=".6" stop-color="var(--a2)"/><stop offset="1" stop-color="var(--a3)"/></linearGradient></defs><circle class="trk" cx="100" cy="100" r="${r}"/><circle class="val" cx="100" cy="100" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" style="--full:${c.toFixed(1)}"/></svg>
    <div class="num"><b data-count="${val}">${val}</b><span>${label}</span></div></div>`}

function vResArch(){const r=S.results.arch;if(!r)return go("home"),"";const A=ARCH[r.lvl-1];
  return shell(`<main class="screen center anim-in">
    <p class="kick">Your clarity score</p>
    ${ring(r.score,"out of 100")}
    <p class="verdict">${esc(VERDICT[r.lvl])}</p><p>You’re ${esc(A.name)}.</p>
    <div class="sec"><div class="gcard persona" style="padding:12px"><img src="${A.img}" alt="${esc(A.who)}"><div><b>${esc(A.name)}</b><span>${esc(A.who)} energy</span></div></div>
      <p class="body">${esc(A.gz)}</p></div>
    <div class="sec"><h3>Your next 3 moves</h3><ol class="moves gcard" style="padding:0">${A.store.map((t,i)=>`<li><span>0${i+1}</span>${esc(t)}</li>`).join("")}</ol></div>
    <div class="stack" style="margin-top:30px">${S.results.career?`<a class="btn" href="#r-career">See my career match</a>`:`<button class="btn" data-act="begin" data-k="career">Next: which career fits me?</button>`}
      <button class="txt" data-act="begin" data-k="arch">Retake</button></div>
  </main>`)}

function vResCareer(){const r=S.results.career;if(!r)return go("home"),"";const M=r.top.map(x=>Object.assign({},x,{d:DIRS.find(d=>d.id===x.id)})).filter(x=>x.d),m1=M[0],rest=M.slice(1,UI.more?6:3),pick=(S.profile||{}).target;
  const why=x=>[x.loves.length?"You’d love to "+listJoin(x.loves)+".":"",x.rb?"Your resume backs it up.":""].filter(Boolean).join(" ")||(x.likes.length?"You’re into "+listJoin(x.likes)+".":"");
  return shell(`<main class="screen center anim-in">
    <p class="kick">Your top match</p>
    ${ring(m1.pct,"match")}
    <p class="verdict">You’re built for <b style="font-weight:600">${esc(m1.d.t)}</b>.</p><p>${esc(why(m1))}</p>
    <span class="searchpill">Search for <b>${esc(m1.d.role)}</b></span>
    <div class="stack" style="margin-top:18px"><button class="btn${pick===m1.d.id?"":" glass"}" data-act="pickdir" data-v="${m1.d.id}">${pick===m1.d.id?"Saved as your target":"Make this my target"}</button></div>
    <div class="sec"><h3>Also strong</h3><div class="gcard" style="padding:0">${rest.map(x=>`<div class="alt"><span>${esc(x.d.t)}</span><em>${x.pct}%</em></div>`).join("")}</div>
      ${UI.more?"":`<button class="txt" data-act="more" style="margin-top:6px">Show more</button>`}</div>
    <div class="stack" style="margin-top:30px">${S.results.arch?`<a class="btn" href="#me">Go to my profile</a>`:`<button class="btn" data-act="begin" data-k="arch">Next: get my score</button>`}
      <button class="txt" data-act="begin" data-k="career">Retake</button></div>
  </main>`,{theme:"career"})}

function vMe(){const p=S.profile;if(!p)return go(AUTH.user?"setup":"join"),"";const ra=S.results.arch,rc=S.results.career,A=ra&&ARCH[ra.lvl-1],c1=rc&&DIRS.find(d=>d.id===rc.top[0].id),tgt=p.target&&DIRS.find(d=>d.id===p.target);
  return shell(`<main class="screen center anim-in">
    <div class="avatar">${p.avatar?`<img src="${esc(p.avatar)}" alt="">`:esc((p.first||p.name||"?").charAt(0).toUpperCase())}</div>
    <h1 class="t1" style="margin-bottom:6px">${esc(p.name||"You")}</h1>
    <p class="t2" style="margin-bottom:24px">${esc([p.school,p.grad&&"Class of "+p.grad].filter(Boolean).join(" · ")||"Add your school")}${tgt?`<br>Target: ${esc(tgt.t)}`:""}</p>
    <div class="res2">
      ${A?`<a class="mini" href="#r-arch"><span>Clarity score</span><b>${ra.score}</b><strong>${esc(A.name)}</strong></a>`:`<button class="mini" data-act="begin" data-k="arch"><span>Clarity score</span><b>–</b><strong>Take the quiz →</strong></button>`}
      ${c1?`<a class="mini t-career" href="#r-career"><span>Top match</span><b>${rc.top[0].pct}%</b><strong>${esc(c1.t)}</strong></a>`:`<button class="mini" data-act="begin" data-k="career"><span>Top match</span><b>–</b><strong>Find your career →</strong></button>`}
    </div>
    ${(p.experience||[]).length?`<div class="sec"><h3>Experience</h3><div class="gcard" style="padding:0">${p.experience.map(x=>`<div class="alt"><span>${esc(x.title||"Role")}</span><em>${esc(x.company)}</em></div>`).join("")}</div></div>`:""}
    <div class="stack" style="margin-top:28px"><a class="btn glass" href="#setup">${p.resume?"Edit profile":"Add your resume"}</a>${AUTH.user?`<button class="txt" data-act="logout">Log out</button>`:`<a class="txt" href="#join">Save to an account</a>`}</div>
  </main>`)}

/* ---------- help ---------- */
const HELP_TYPES=[["bug","Something’s broken"],["idea","I have an idea"],["help","I need help"],["other","Other"]];
function helpUI(){if(!UI.help)return `<button class="help-fab" data-act="help" aria-label="Help and feedback">?</button>`;const h=UI.help;
  if(h.sent)return `<div class="modal-bg" data-act="helpx"><div class="modal"><h2>Got it.</h2><p class="t2" style="margin:0">Your message was sent. We read every one.</p><button class="btn" data-act="helpx">Done</button></div></div>`;
  return `<div class="modal-bg" data-act="helpx"><div class="modal" role="dialog" aria-modal="true"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Talk to us</h2><button class="circ" data-act="helpx" aria-label="Close">×</button></div>
    <div class="chips">${HELP_TYPES.map(([v,l])=>`<button class="chip" data-act="helptype" data-v="${v}" aria-pressed="${h.type===v}">${l}</button>`).join("")}</div>
    <textarea class="in" id="help-msg" placeholder="Write your message…">${esc(h.msg||"")}</textarea><input class="in" id="help-email" type="email" value="${esc(h.email||(AUTH.user&&AUTH.user.email)||"")}" placeholder="Your email (so we can reply)">
    ${h.err?`<p class="msg err">${esc(h.err)}</p>`:""}<button class="btn" data-act="helpsend" ${h.busy?"disabled":""}>${h.busy?"Sending…":"Send"}</button></div></div>`}
async function helpSend(){const h=UI.help;h.msg=($("#help-msg").value||"").trim();h.email=($("#help-email").value||"").trim();if(!h.msg){h.err="Write a quick message first.";render();return}
  h.busy=true;h.err="";render();let ok=false;
  if(sb){try{const {error}=await sb.from("feedback").insert({kind:h.type||"other",message:h.msg,email:h.email||null,page:route(),user_id:AUTH.user?AUTH.user.id:null,agent:navigator.userAgent.slice(0,200)});ok=!error}catch(e){}}
  h.busy=false;if(ok){h.sent=true;render();return}location.href="mailto:ameliamkopp@gmail.com?subject="+encodeURIComponent("CLOCKED feedback")+"&body="+encodeURIComponent(h.msg);h.sent=true;render()}

/* ---------- render ---------- */
function render(){const r=route();let html;
  if(UI.loading)html=vLoading(UI.loading);
  else if(r==="auth")html=shell(`<main class="screen center"><div class="orb busy"></div><span class="loadpill"><i></i>Logging you in</span></main>`,{bare:true});
  else if(r==="join")html=vJoin();else if(r==="setup")html=vSetup();
  else if(r==="q-arch"||r==="q-career")html=vQuiz(r.slice(2));
  else if(r==="r-arch")html=vResArch();else if(r==="r-career")html=vResCareer();
  else if(r==="me")html=vMe();else html=vHome();
  const ae=document.activeElement,keep=ae&&ae.id&&/^(pf-|qz-text|au-|help-|paste)/.test(ae.id)?[ae.id,ae.selectionStart]:null;
  $("#app").innerHTML=html+((r==="home"&&!UI.loading)||UI.help?helpUI():"")+(UI.toast?`<div class="toast" role="status">${esc(UI.toast)}</div>`:"");
  if(keep){const el=document.getElementById(keep[0]);if(el){el.focus();try{el.setSelectionRange(keep[1],keep[1])}catch(e){}}}}

/* ---------- events ---------- */
const ACT={
  begin:el=>{const k=el.dataset.k,done=S.profile&&S.profile.done;if(!done&&!AUTH.user&&!S.guest){S.pending="q-"+k;save();go("join");return}if(!done&&AUTH.user){S.pending="q-"+k;save();go("setup");return}startQuiz(k)},
  toquizzes:(el,e)=>{if(route()==="home"){e.preventDefault();const q=$("#quizzes");if(q)q.scrollIntoView({behavior:"smooth"})}else{e.preventDefault();go("home");setTimeout(()=>{const q=$("#quizzes");if(q)q.scrollIntoView()},50)}},
  li:()=>liLogin(),
  authmode:()=>{UI.mode=UI.mode==="signup"?"login":"signup";UI.msg="";render()},
  guest:()=>{S.guest=true;const n=S.pending||"q-arch";S.pending=null;save();startQuiz(n.slice(2))},
  addxp:()=>{const p=S.profile;(p.experience||(p.experience=[])).push({title:"",company:"",dates:""});save();render()},
  rmxp:el=>{S.profile.experience.splice(+el.dataset.i,1);save();render()},
  pasteres:()=>{const t=($("#paste-res").value||"").trim();if(t.length<30){UI.parse={err:"Paste a bit more of your resume."};render();return}applyResume(parseResume(t.split(/\n+/).map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean)),"Pasted text");render()},
  setupdone:()=>{const p=S.profile;if(!p.name){toast("Add your name first.");return}p.first=p.name.split(" ")[0];p.done=true;
    if(p.grad&&!S.draft.arch){const y=+p.grad-YEAR;S.draft.arch={i:0,a:{c_stage:y<=0?"grad":y===1?"senior":y===2?"junior":"early"},stack:[]}}
    save();const n=S.pending||"q-arch";S.pending=null;save();if(n.startsWith("q-"))startQuiz(n.slice(2));else go(n)},
  one:el=>{const k=route().slice(2),d=S.draft[k],q=QUIZ[k].qs[d.i];d.a[q.id]=el.dataset.v;save();render();clearTimeout(ACT.one.t);ACT.one.t=setTimeout(()=>{if(S.draft[k].i===d.i&&route()==="q-"+k)qNext(k)},420)},
  many:el=>{const k=route().slice(2),d=S.draft[k],q=QUIZ[k].qs[d.i],a=Array.isArray(d.a[q.id])?d.a[q.id]:(d.a[q.id]=[]),v=el.dataset.v,j=a.indexOf(v);if(j>=0)a.splice(j,1);else{a.push(v);if(q.max&&a.length>q.max)a.shift()}save();render()},
  pair:el=>{const k=route().slice(2),d=S.draft[k],q=QUIZ[k].qs[d.i],cur=d.a[q.id]||(d.a[q.id]={});cur[el.dataset.p]=el.dataset.v;save();render()},
  rate:el=>{const k=route().slice(2),d=S.draft[k],q=QUIZ[k].qs[d.i],cur=d.a[q.id]||(d.a[q.id]={});cur[el.dataset.t]=el.dataset.v;save();render()},
  qnext:()=>{const k=route().slice(2);clearTimeout(ACT.one.t);qNext(k)},
  qback:()=>{const k=route().slice(2);clearTimeout(ACT.one.t);qBack(k)},
  qexit:()=>go(S.profile&&S.profile.done?"me":"home"),
  pickdir:el=>{const p=S.profile||(S.profile={});p.target=el.dataset.v;save();toast("Saved as your target.");render()},
  more:()=>{UI.more=true;render()},
  edit:()=>{UI.edit=true;render()},
  logout:async()=>{if(sb)await sb.auth.signOut();AUTH.user=null;S=fresh();save();go("home")},
  help:()=>{UI.help={};render()},helpx:(el,e)=>{if(el.classList.contains("modal-bg")&&e.target!==el)return;UI.help=null;render()},
  helptype:el=>{UI.help.type=el.dataset.v;UI.help.msg=($("#help-msg")||{}).value||"";render()},helpsend:()=>helpSend(),
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const f=ACT[el.dataset.act];if(f){if(el.tagName==="A"&&el.dataset.act!=="toquizzes")e.preventDefault();f(el,e)}});
document.addEventListener("submit",e=>{if(e.target.matches("[data-auth]")){e.preventDefault();emailAuth(e.target)}});
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.pf){S.profile=S.profile||{};S.profile[t.dataset.pf]=t.value;save()}
  else if(t.dataset.xp!=null){S.profile.experience[+t.dataset.xp][t.dataset.f]=t.value;save()}
  else if(t.matches("[data-qtext]")){const k=route().slice(2),d=S.draft[k],q=QUIZ[k].qs[d.i];d.a[q.id]=t.value;save();const b=$(".qz-foot .go"),ok=t.value.trim()!=="";b.disabled=!ok&&!q.optional;b.innerHTML=(!ok&&q.optional?"Skip":"Next")+"<i>→</i>"}});
document.addEventListener("change",e=>{if(e.target.matches("[data-resume]"))handleResume(e.target.files[0])});
document.addEventListener("dragover",e=>{const d=e.target.closest&&e.target.closest(".drop");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",e=>{const d=e.target.closest&&e.target.closest(".drop");if(d)d.classList.remove("over")});
document.addEventListener("drop",e=>{const d=e.target.closest&&e.target.closest(".drop");if(d){e.preventDefault();d.classList.remove("over");handleResume(e.dataTransfer.files[0])}});
document.addEventListener("keydown",e=>{if(!route().startsWith("q-")||/TEXTAREA|INPUT/.test(document.activeElement.tagName))return;if(e.key==="Enter"){const b=$(".qz-foot .go");if(b&&!b.disabled)b.click()}
  const n="abcdef".indexOf(e.key.toLowerCase());if(n>=0){const t=document.querySelectorAll(".tiles .tile")[n];if(t)t.click()}});
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
</script>
</body>
</html>

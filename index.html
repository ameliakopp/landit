<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hirable</title>
<meta name="theme-color" content="#F4F9EE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hirable">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="The internship quiz that tells you the truth. Get your archetype, your clarity score, and the careers you're actually built for.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Inter+Tight:wght@300;400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#FFFFFF;--ink:#F6F8F3;--mute:rgba(21,38,31,.55);--faint:rgba(21,38,31,.32);
  --glass:rgba(21,38,31,.05);--glass2:rgba(21,38,31,.085);--edge:rgba(21,38,31,.08);
  --a1:#A9D18C;--a2:#7FB069;--a3:#CFE6B4;
  --sans:"Figtree",system-ui,-apple-system,sans-serif;--ease:cubic-bezier(.22,.8,.24,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}

/* soft ambient glow, fixed so it never jumps between screens */
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.amb i{position:absolute;border-radius:50%;filter:blur(90px);animation:drift 24s ease-in-out infinite alternate}
.amb i:nth-child(1){width:75vmax;height:75vmax;left:-30vmax;top:-40vmax;background:radial-gradient(circle,var(--a1),transparent 62%);opacity:.32}
.amb i:nth-child(2){width:65vmax;height:65vmax;right:-32vmax;top:12vh;background:radial-gradient(circle,var(--a2),transparent 62%);opacity:.2;animation-delay:-8s}
.amb i:nth-child(3){width:65vmax;height:65vmax;left:-12vmax;bottom:-48vmax;background:radial-gradient(circle,var(--a3),transparent 62%);opacity:.2;animation-delay:-16s}
@keyframes drift{to{transform:translate(3vmax,2vmax) scale(1.06)}}
.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 4px;max-width:580px;width:100%;margin:0 auto}
.word{font-weight:500;font-size:20px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.mark{width:20px;height:20px;opacity:.9}
.circ{width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid var(--edge);display:grid;place-items:center;font-size:16px;overflow:hidden;flex:none;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:background .3s var(--ease)}
.circ:hover{background:var(--glass2)}
.circ img{width:100%;height:100%;object-fit:cover}
.chipc{padding:7px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);font-size:14.5px;font-variant-numeric:tabular-nums;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}

/* layout */
.screen{flex:1;width:100%;max-width:560px;margin:0 auto;padding:10px 22px 130px;display:flex;flex-direction:column}
.center{justify-content:center;align-items:center;text-align:center}
.has-tabs .screen{padding-bottom:150px}
.anim-in{animation:fade .6s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* type */
.ttl{font-weight:500;font-size:22px;line-height:1.2;letter-spacing:-.03em;margin:10px 0 0}
.ttl span{display:block;color:var(--mute);font-weight:400}
.kick{font-size:14.5px;color:var(--mute);margin:0 0 12px}
.t1{font-weight:400;font-size:clamp(34px,8.6vw,48px);line-height:1.08;letter-spacing:-.035em;margin:0 0 14px}
.t1 b{font-weight:600}
.t2{font-size:16.5px;color:var(--mute);margin:0 0 30px;max-width:34ch}
.cap{font-size:14.5px;color:var(--mute);margin:0 0 16px;text-align:center}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 0 18px}
.pills span{font-size:13.5px;padding:6px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);color:var(--mute)}

/* buttons */
.stack{display:flex;flex-direction:column;gap:10px;width:100%;max-width:370px;margin-left:auto;margin-right:auto}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:999px;padding:17px 22px;font-size:16px;font-weight:500;background:var(--ink);color:#FFFFFF;transition:transform .25s var(--ease),background .3s var(--ease),opacity .3s}
.btn:active{transform:scale(.985)}
.btn.glass{background:var(--glass);color:var(--ink);border:1px solid var(--edge);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.btn.glass:hover{background:var(--glass2)}
.btn[disabled]{opacity:.35;pointer-events:none}
.txt{background:none;border:0;padding:8px;color:var(--mute);font-size:14px;transition:color .3s}
.txt:hover{color:var(--ink)}

/* orb */
.orb{position:relative;width:min(56vw,232px);aspect-ratio:1;border-radius:50%;margin:8px auto 36px;
  background:radial-gradient(circle at 32% 28%,rgba(21,38,31,.6),transparent 30%),radial-gradient(circle at 70% 70%,var(--a3),transparent 62%),radial-gradient(circle at 28% 76%,var(--a2),transparent 58%),radial-gradient(circle at 62% 28%,var(--a1),transparent 62%),#1E3328;
  box-shadow:0 0 120px -20px var(--a2),inset 0 0 50px rgba(21,38,31,.18);animation:breathe 7s ease-in-out infinite}
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.12),transparent 40%);animation:spin 14s linear infinite;mix-blend-mode:overlay}
.orb.sm{width:110px;margin-bottom:26px}
.orb.busy{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.035);filter:saturate(1.1) brightness(1.05)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* score ring */
.ring{position:relative;width:min(66vw,250px);aspect-ratio:1;margin:14px auto 22px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .trk{fill:none;stroke:rgba(21,38,31,.07);stroke-width:9}
.ring .val{fill:none;stroke:url(#rg);stroke-width:9;stroke-linecap:round;filter:drop-shadow(0 0 10px rgba(127,176,105,.55));animation:ringin 1.8s var(--ease) both}
@keyframes ringin{from{stroke-dashoffset:var(--full)}}
.ring .glow{position:absolute;inset:16%;border-radius:50%;background:radial-gradient(circle,var(--a2),transparent 70%);opacity:.22;filter:blur(20px)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-weight:300;font-size:clamp(62px,16vw,84px);line-height:1;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.ring .num b small{font-size:.42em;letter-spacing:0;margin-left:2px;color:var(--mute)}
.ring .num span{font-size:13.5px;color:var(--mute);margin-top:6px}

/* tiles */
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.tl{position:relative;border-radius:24px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:15px 16px 17px;min-height:116px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;overflow:hidden;color:var(--ink);transition:background .3s var(--ease)}
a.tl:hover,button.tl:hover{background:var(--glass2)}
.tl.wide{grid-column:1/-1;min-height:96px}
.tl .h{font-size:14.5px;font-weight:500;color:var(--mute);display:flex;justify-content:space-between;gap:8px;position:relative;z-index:1}
.tl .h em{font-style:normal;font-weight:400;font-size:12.5px;padding:3px 9px;border-radius:999px;background:rgba(21,38,31,.12);color:var(--ink)}
.tl .v{font-weight:300;font-size:36px;line-height:1;letter-spacing:-.04em;position:relative;z-index:1;font-variant-numeric:tabular-nums}
.tl .v.s{font-size:19px;font-weight:500;letter-spacing:-.02em;line-height:1.25}
.tl .d{font-size:14.5px;color:var(--mute);position:relative;z-index:1;line-height:1.5}
.tl .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(127,176,105,.55),rgba(127,176,105,.45));border-radius:24px 0 0 24px;animation:grow 1.4s .3s var(--ease) both}
@keyframes grow{from{width:0!important}}
.tl .bar{position:relative;z-index:1;height:3px;border-radius:2px;background:rgba(21,38,31,.08);overflow:hidden}
.tl .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2));border-radius:2px;animation:grow 1.2s .4s var(--ease) both}
.tl.y{background:linear-gradient(135deg,rgba(127,176,105,.28),rgba(127,176,105,.22) 60%,rgba(169,209,140,.18));border-color:rgba(21,38,31,.12)}
.sech{font-weight:500;font-size:19px;letter-spacing:-.025em;margin:34px 0 12px;width:100%;text-align:left}
.sech span{color:var(--mute);font-weight:400}
.verdict{font-size:19px;line-height:1.35;letter-spacing:-.02em;margin:0 0 6px;text-align:center}
.verdict+.sub{color:var(--mute);margin:0 0 22px;text-align:center}
.steps{display:flex;flex-direction:column;gap:10px;width:100%}
.step{display:flex;gap:14px;align-items:flex-start;border-radius:24px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:15px 16px;text-align:left;width:100%;transition:opacity .4s var(--ease)}
.step .wk{font-size:12.5px;color:var(--faint);display:block;margin-bottom:3px}
.step b{display:block;font-weight:500;font-size:16px;line-height:1.3;letter-spacing:-.01em}
.step small{display:block;font-size:14.5px;color:var(--mute);margin-top:3px}
.step .ck{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--faint);margin-top:2px;display:grid;place-items:center;font-size:13.5px;color:#FFFFFF;background:transparent;transition:background .3s var(--ease)}
.step.done{opacity:.55}
.step.done .ck{background:var(--ink)!important;border-color:var(--ink)}
.step.done b{text-decoration:line-through}
.step .go2{margin-left:auto;align-self:center;font-size:13.5px;padding:7px 12px;border-radius:999px;background:var(--ink);color:#FFFFFF;border:0;flex:none}
.alt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 18px;font-size:15.5px}
.alt+.alt{border-top:1px solid var(--edge)}
.alt em{font-style:normal;color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums;text-align:right}
.gcard{border-radius:24px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);width:100%;text-align:left}

/* quiz */
.qbar{display:flex;gap:3px;max-width:516px;width:calc(100% - 44px);margin:6px auto 0}
.qbar i{flex:1;height:2px;border-radius:2px;background:rgba(21,38,31,.08);transition:background .5s var(--ease)}
.qbar i.on{background:rgba(21,38,31,.75)}
.qhead{display:flex;flex-direction:column;gap:10px;margin:18px 0 24px}
.qlabel{font-size:13.5px;color:var(--mute)}
.qq{font-weight:400;font-size:clamp(28px,7vw,38px);line-height:1.14;letter-spacing:-.03em;margin:0;text-wrap:balance}
.react{font-size:14.5px;margin:0;padding:7px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);color:var(--mute);align-self:flex-start;animation:fade .6s var(--ease) both}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles.one-col{grid-template-columns:1fr}
.tile{position:relative;text-align:left;border-radius:22px;border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:15px 17px 17px;min-height:90px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;font-size:16px;line-height:1.28;color:var(--ink);transition:background .35s var(--ease),color .35s var(--ease),box-shadow .45s var(--ease),transform .25s var(--ease),border-color .35s}
.tiles.one-col .tile{min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;padding:18px 20px}
.tile .k{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;transition:color .35s}
.tile:hover{background:var(--glass2)}
.tile:active{transform:scale(.985)}
.tile[aria-pressed="true"]{background:rgba(21,38,31,.94);color:#FFFFFF;border-color:transparent;box-shadow:0 0 36px -10px rgba(127,176,105,.7)}
.tile[aria-pressed="true"] .k{color:rgba(0,0,0,.4)}
.qtext{width:100%;min-height:130px;border-radius:22px;border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:var(--ink);font:inherit;font-size:18px;padding:18px;resize:none;transition:border-color .3s}
.qtext::placeholder{color:var(--faint)}
.qtext:focus{outline:none;border-color:rgba(21,38,31,.28)}
.pairs{display:flex;flex-direction:column;gap:10px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.pair>span{font-size:13.5px;color:var(--faint)}
.pair .tile{min-height:62px;justify-content:center;text-align:center;align-items:center;padding:14px}
.rate{display:flex;flex-direction:column;gap:10px}
.rate-row{border-radius:22px;border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:15px;display:flex;flex-direction:column;gap:12px}
.rate-row>b{font-weight:400;font-size:16px;line-height:1.35}
.rate-b{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rate-b button{border-radius:999px;border:1px solid var(--edge);background:transparent;padding:9px 4px;font-size:14.5px;color:var(--mute);transition:background .3s var(--ease),color .3s}
.rate-b button[aria-pressed="true"]{background:var(--ink);color:#FFFFFF;border-color:var(--ink)}
.qfoot{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:14px 22px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(255,255,255,.96) 50%,rgba(255,255,255,0))}
.qfoot .in{max-width:516px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.qfoot .cnt{font-size:14.5px;color:var(--mute)}
.go{display:flex;align-items:center;gap:12px;margin-left:auto;background:none;border:0;padding:0;font-size:15px;color:var(--mute);transition:opacity .4s var(--ease)}
.go i{width:56px;height:56px;border-radius:50%;background:var(--ink);color:#FFFFFF;display:grid;place-items:center;font-style:normal;font-size:20px;transition:transform .25s var(--ease)}
.go[disabled]{opacity:.28;pointer-events:none}
.go:active i{transform:scale(.94)}
.loadpill{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);font-size:14.5px;margin-bottom:12px}
.loadpill i{width:7px;height:7px;border-radius:50%;background:var(--ink);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.2}}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--edge);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.tabs .in{max-width:420px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;color:var(--faint);padding:4px;transition:color .3s}
.tabs a svg{width:21px;height:21px}
.tabs a.on{color:var(--ink)}

/* forms */
.in{width:100%;border-radius:18px;border:1px solid var(--edge);background:var(--glass);color:var(--ink);padding:15px 17px;font:inherit;font-size:16px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:border-color .3s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:rgba(21,38,31,.28)}
textarea.in{min-height:120px;resize:vertical}
.msg{font-size:14px;line-height:1.5;padding:12px 16px;border-radius:18px;background:var(--glass);border:1px solid var(--edge);margin:0;text-align:left}
.msg.err{border-color:rgba(255,110,110,.45)}
details summary{list-style:none;cursor:pointer}details summary::-webkit-details-marker{display:none}
.drop{position:relative;width:min(58vw,212px);aspect-ratio:1;border-radius:50%;margin:0 auto 26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;border:1px dashed rgba(21,38,31,.22);background:radial-gradient(circle at 50% 40%,rgba(21,38,31,.08),transparent 70%);cursor:pointer;transition:transform .4s var(--ease),border-color .3s}
.drop::before{content:"";position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,var(--a2),transparent 65%);opacity:.18;filter:blur(22px);z-index:-1}
.drop:hover,.drop.over{transform:scale(1.025);border-color:rgba(21,38,31,.5)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;border-radius:50%}
.drop b{font-weight:500;font-size:17px}
.drop span{font-size:14.5px;color:var(--mute)}
.drop.done{border-style:solid;border-color:rgba(21,38,31,.3)}
.found{text-align:left;width:100%}
.xp{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.xp .in{padding:12px 14px;font-size:15px}
.xp .rm{width:40px;height:40px;border-radius:50%;border:1px solid var(--edge);background:var(--glass)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.xp{grid-template-columns:1fr auto}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--edge);background:var(--glass);font-size:14.5px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#FFFFFF}
.tiny{font-size:13.5px;color:var(--faint)}
.help-fab{position:fixed;right:16px;bottom:16px;z-index:30;width:40px;height:40px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);color:var(--mute);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:15px}
.has-tabs~.help-fab,body:has(.has-tabs) .help-fab{bottom:88px}
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fade .4s var(--ease) both}
.modal{width:100%;max-width:440px;background:#FFFFFF;border:1px solid var(--edge);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:12px}
.modal h2{font-weight:400;font-size:26px;letter-spacing:-.03em;margin:0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:#1c1c1f;border:1px solid var(--edge);color:var(--ink);font-size:14px;padding:12px 18px;border-radius:999px;animation:fade .4s var(--ease) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.still .anim-in,.still .ring .val,.still .tl .fill,.still .tl .bar i,.still .react{animation:none}

/* v5: hook, resume read-out, gap reveal, plan */
.how3{list-style:none;margin:-8px 0 28px;padding:0;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.how3 li{display:flex;align-items:center;gap:8px;padding:7px 13px 7px 7px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);font-size:14.5px;color:var(--mute)}
.how3 b{width:20px;height:20px;border-radius:50%;background:var(--ink);color:#FFFFFF;display:grid;place-items:center;font-size:12.5px;font-weight:600}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;text-align:left}
.sw:has(.sw-col:only-child){grid-template-columns:1fr}
@media (max-width:520px){.sw{grid-template-columns:1fr}}
.sw-col{border-radius:24px;background:var(--glass);border:1px solid var(--edge);padding:14px 16px;display:flex;flex-direction:column;gap:12px;animation:fade .6s var(--ease) both}
.sw-col+.sw-col{animation-delay:.15s}
.sw-col h3{margin:0;font-size:13.5px;font-weight:500;color:var(--mute)}
.swi{display:flex;gap:12px;align-items:flex-start}
.swi b{display:block;font-weight:500;font-size:15px;line-height:1.3}

/* ===== light theme (matches the About page) ===== */

html,body{background:#FFFFFF;color:#15261F}
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.amb i{display:none}
.amb::before{content:"";position:absolute;left:-10%;right:-10%;top:-140px;height:400px;background:radial-gradient(60% 60% at 30% 30%,#CFE6B4 0%,transparent 70%),radial-gradient(55% 60% at 62% 25%,#A9D18C 0%,transparent 70%),radial-gradient(45% 55% at 85% 40%,#E4F1CF 0%,transparent 70%);filter:blur(40px);opacity:.7}

.qq{font-size:clamp(32px,8vw,44px);line-height:1.08}
.gap-top{font-size:clamp(34px,8.5vw,50px);line-height:1.06}
.sech{font-size:28px;margin-top:44px}
.ttl{font-size:30px;line-height:1.1}

.home .hook b{font-weight:400;font-style:italic}
.btn{background:#15261F;color:#fff}

/* ---------- state ---------- */

/* =====================================================================
   DEV ONLY: skip a quiz and preview its result screen.

   On the live site it's off for everyone. Turn it on for YOUR browser only:
     https://ameliakopp.github.io/landit/?devmode=on    (…?devmode=off to turn off)

const UI={msg:"",busy:false,mode:"signup",help:null,toast:null,parse:null};

const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6dW15Y2Fwdmdxa2VqZW5leHBxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNDIxMTgsImV4cCI6MjEwODYxODExOH0.OgqQUbg5Iy7QBbF9MTdaxJdYGHOR9AfqCQDJvffdggw";

  const p=S.profile||{},row={id:AUTH.user.id,first_name:p.first||null,company:(p.experience&&p.experience[0]&&p.experience[0].company)||null,state:S,updated_at:new Date().toISOString()};

async function cloudLoad(){if(DEV_PREVIEW)return;let data,error;try{({data,error}=await sb.from("students").select("state").eq("id",AUTH.user.id).maybeSingle())}catch(e){error=e}

function metaProfile(u){const m=(u&&u.user_metadata)||{},name=m.full_name||m.name||[m.given_name,m.family_name].filter(Boolean).join(" ")||"";
  return {name,first:(m.given_name||name.split(" ")[0]||"").trim(),email:u.email||m.email||"",avatar:m.avatar_url||m.picture||""}}
async function setUser(u){try{await setUser0(u)}catch(e){console.error(e);S=normS(S);render()}}
async function setUser0(u){const was=AUTH.user&&AUTH.user.id;AUTH.user=u||null;
  if(AUTH.user&&AUTH.user.id!==was){await cloudLoad();const mp=metaProfile(AUTH.user);
    S.profile=Object.assign({},mp,S.profile||{});["name","first","avatar"].forEach(k=>{if(!S.profile[k]&&mp[k])S.profile[k]=mp[k]});if(!S.profile.email)S.profile.email=mp.email;save();
    const r=route();if(r==="join"||r==="home"||/access_token|error_description|code=/.test(location.href))go(S.profile.done?(S.pending||"me"):"setup");else render()}

async function emailAuth(form){const email=form.querySelector("#au-email").value.trim(),password=form.querySelector("#au-pw").value;
  if(!sb){UI.msg="We couldn’t reach our login service. Check your connection (or turn off any ad blocker) and try again.";render();return}

  catch(e){UI.busy=false;UI.msg="That took too long. Check your connection and try again.";render();return}
  UI.busy=false;if(res.error){UI.msg=/invalid login/i.test(res.error.message)?"That email and password don’t match. Try again, or sign up if you’re new.":/already registered/i.test(res.error.message)?"You already have an account. Tap “Have an account? Log in”.":res.error.message;render();return}
  if(UI.mode==="signup"&&!res.data.session){UI.msg="Check your email and tap the link to confirm. Then come back here and log in with the same email and password.";UI.mode="login";render()}}

/* ---------- resume reader ---------- */
const PDFJS="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/";
function loadPdf(){if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);return new Promise((ok,no)=>{const s=document.createElement("script");s.src=PDFJS+"pdf.min.js";s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js";ok(window.pdfjsLib)};s.onerror=()=>no(new Error("Couldn’t load the PDF reader"));document.head.appendChild(s)})}
async function pdfLines(file){const lib=await loadPdf(),doc=await lib.getDocument({data:await file.arrayBuffer()}).promise,out=[];UI.pages=doc.numPages;
  for(let p=1;p<=Math.min(doc.numPages,4);p++){const pg=await doc.getPage(p),tc=await pg.getTextContent(),rows=[];
    tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=it.transform[5];let r=rows.find(r=>Math.abs(r.y-y)<=2.5);if(!r){r={y,it:[]};rows.push(r)}r.it.push({x:it.transform[4],w:it.width||0,s:it.str})});
    rows.sort((a,b)=>b.y-a.y).forEach(r=>{r.it.sort((a,b)=>a.x-b.x);let line="",end=null;r.it.forEach(i=>{if(end!==null){const gap=i.x-end;line+=gap>18?" | ":gap>1.5&&!/\s$/.test(line)&&!/^\s/.test(i.s)?" ":""}line+=i.s;end=i.x+i.w});out.push(line.replace(/\s+/g," ").trim())})}
  return out.filter(Boolean)}
const MON="(?:jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\\.?";
const DATE_RX=new RegExp(`((?:${MON}\\s+)?(?:19|20)\\d{2}\\s*(?:–|—|-|to)\\s*(?:(?:${MON}\\s+)?(?:19|20)\\d{2}|present|current|now))|((?:summer|fall|spring|winter)\\s+(?:19|20)\\d{2})|(${MON}\\s+(?:19|20)\\d{2})`,"i");
const HEAD_RX=/^(education|academic background|experience|work experience|professional experience|relevant experience|employment|internships?|leadership( experience)?|leadership & activities|activities|campus involvement|involvement|extracurriculars?|projects?|skills|skills & interests|skills and interests|technical skills|interests|honors( & awards)?|awards|certifications?|additional( information)?|volunteer(ing| experience)?|languages)\s*:?$/i;
const SEC_OF=h=>/educ|academic/i.test(h)?"edu":/skill|interest|language|certif|additional/i.test(h)?"skills":/project/i.test(h)?"proj":/honor|award/i.test(h)?"other":"exp";
/* real accomplishment bullets only: skip title / company / location / date lines, and join lines that wrapped */
const ROLE_KW=/\b(intern|internship|assistant|analyst|associate|coordinator|manager|president|vice president|lead|director|member|fellow|ambassador|chair|founder|co-founder|editor|writer|designer|developer|engineer|researcher|consultant|captain|officer|tutor|volunteer|representative|specialist|strategist|producer|organizer|treasurer|secretary)\b/i;
const LOC_RX=/(^|\s|\|)(remote|hybrid|on-?site)\b|\b[A-Z][a-zA-Z.]+(?: [A-Z][a-zA-Z.]+)*,\s?(?:[A-Z]{2}|[A-Z][a-z]+)\b\s*$/;
function metaLine(l){const t=l.replace(/^[•●▪◦∙·\-–*]\s*/,"").trim(),w=t.split(/\s+/);
  if(DATE_RX.test(t)||/\s\|\s|\t/.test(t)||LOC_RX.test(t))return true;
  const caps=w.filter(x=>/^[A-Z&(]/.test(x)).length/w.length;
  if(w.length<=9&&!/[.!?]$/.test(t)&&(caps>=.6||ROLE_KW.test(t)))return true;
  return false}
function resumeBullets(lines,bullet){const out=[],glyphs=lines.some(bullet);let open=false;
  lines.forEach(l=>{const t=l.replace(/^[•●▪◦∙·\-–*]\s*/,"").trim();if(!t)return;
    if(bullet(l)){if(metaLine(l)&&t.split(/\s+/).length<=6){open=false;return}out.push(t);open=!/[.!?]$/.test(t);return}
    const cont=out.length&&((glyphs&&open)||/^[a-z(&,]/.test(t))&&!metaLine(l);
    if(cont){out[out.length-1]+=" "+t;open=!/[.!?]$/.test(t);return}
    open=false;
    if(!glyphs&&t.length>40&&!metaLine(l)&&/^[A-Z]/.test(t)){out.push(t);open=!/[.!?]$/.test(t)}});
  return out}
function parseResume(lines){
  const txt=lines.join("\n"),R={name:"",email:"",phone:"",linkedinUrl:"",school:"",major:"",grad:"",experience:[],skills:[],bullets:[],lines:lines.length,text:txt.slice(0,12000)};
  R.email=(txt.match(/[\w.+-]+@[\w-]+\.[\w.-]+/)||[""])[0];
  R.phone=(txt.match(/(\+?1[\s.-]?)?\(?\d{3}\)?[\s.-]\d{3}[\s.-]\d{4}/)||[""])[0];
  R.linkedinUrl=(txt.match(/linkedin\.com\/in\/[\w-]+/i)||[""])[0];
  const first=lines.find(l=>l.length<40&&!/[@\d|]/.test(l)&&!HEAD_RX.test(l)&&l.split(" ").length<=4);if(first)R.name=first.replace(/\s+/g," ").replace(/\b([A-Z])([A-Z]+)\b/g,(m,a,b)=>a+b.toLowerCase());
  const secs=[];let cur={k:"top",lines:[]};lines.forEach(l=>{const h=l.replace(/[|:]/g,"").trim();if(h.length<42&&HEAD_RX.test(h)){secs.push(cur);cur={k:SEC_OF(h),lines:[]}}else cur.lines.push(l)});secs.push(cur);
  const bullet=l=>/^[•●▪◦∙·\-–*]\s*/.test(l);
  secs.filter(s=>s.k==="edu").forEach(s=>{s.lines.forEach(l=>{const c=l.replace(/\s\|\s.*$/,"");
    if(!R.school&&/(university|college|institute|school of|academy|polytechnic)/i.test(c))R.school=c.replace(DATE_RX,"").replace(/[,|–-]\s*$/,"").trim();
    const mj=l.match(/(?:bachelor(?:’s|'s)?|master(?:’s|'s)?|b\.?\s?a\.?|b\.?\s?s\.?|b\.?\s?b\.?\s?a\.?|m\.?\s?s\.?)\s*(?:of|in)?\s*(?:arts|science|business administration)?\s*(?:,|in|–|-)?\s*([A-Za-z&,\s]{3,60})/i)||l.match(/major(?:s)?\s*(?:in|:)?\s*([A-Za-z&,\s]{3,60})/i);
    if(!R.major&&mj&&mj[1])R.major=mj[1].replace(/\b(minor|gpa|expected|candidate|concentration)\b.*$/i,"").replace(/[,|\s]+$/,"").trim();
    (l.match(/\b(19|20)\d{2}\b/g)||[]).forEach(y=>{if(+y<=YEAR+6&&(!R.grad||+y>+R.grad))R.grad=y})})});
  secs.filter(s=>s.k==="exp"||s.k==="proj").forEach(s=>resumeBullets(s.lines,bullet).forEach(b=>R.bullets.push(b)));
  secs.filter(s=>s.k==="exp").forEach(s=>{const L=s.lines;for(let i=0;i<L.length;i++){const l=L[i];if(bullet(l))continue;const m=l.match(DATE_RX);if(!m)continue;
    const dates=m[0].replace(/\s+/g," ").trim();let a=l.replace(m[0],"").replace(/\s*\|\s*/g," | ").replace(/(^[\s|,–-]+|[\s|,–-]+$)/g,"");
    const parts=a.split(/\s\|\s|\s[–—]\s/).map(x=>x.trim()).filter(x=>x&&!/^(remote|hybrid|[A-Z][a-z]+(?: [A-Z][a-z]+)*,\s?[A-Z]{2}|New York|NYC)$/.test(x));
    let title=parts[0]||"",company=parts[1]||"";const prev=L[i-1],next=L[i+1];
    if(!company&&prev&&!bullet(prev)&&!DATE_RX.test(prev)&&prev.length<80)company=prev.split(/\s\|\s/)[0].replace(/,\s?[A-Z]{2}$/,"").trim();
    else if(!company&&next&&!bullet(next)&&!DATE_RX.test(next)&&next.length<80){company=title;title=next.split(/\s\|\s/)[0].trim()}
    if(company&&/\b(intern|assistant|analyst|associate|coordinator|manager|president|lead|director|member|fellow|ambassador|chair|founder|editor|writer|designer|developer|engineer|researcher|consultant|captain|officer|tutor|volunteer)\b/i.test(company)&&!/\b(intern|assistant|analyst|associate|coordinator|manager|president|lead|director|member|fellow|ambassador|chair|founder|editor|writer|designer|developer|engineer|researcher|consultant|captain|officer|tutor|volunteer)\b/i.test(title))[title,company]=[company,title];
    if(title||company)R.experience.push({title:title.slice(0,70),company:company.slice(0,70),dates})}});
  secs.filter(s=>s.k==="skills").forEach(s=>s.lines.forEach(l=>l.replace(/^[A-Za-z &/]{2,24}:\s*/,"").split(/[,;•|]/).map(x=>x.replace(/^\s*(and|&)\s+/i,"").trim()).filter(x=>x.length>1&&x.length<32).forEach(x=>{if(!R.skills.some(y=>y.toLowerCase()===x.toLowerCase()))R.skills.push(x)})));
  R.experience=R.experience.slice(0,8);R.skills=R.skills.slice(0,24);return R}
function applyResume(R,fileName){const p=S.profile||(S.profile={});p.resume={name:fileName||"Pasted text",at:new Date().toISOString().slice(0,10)};p.resumeText=R.text;
  ["school","major","grad","phone","linkedinUrl"].forEach(k=>{if(R[k]&&!p[k])p[k]=R[k]});

function analyzeCover(p,a){if(!p||!p.coverText)return null;const t=p.coverText,w=t.split(/\s+/).filter(Boolean).length,good=[],bad=[],co=(a&&a.c_co)||"",role=String((a&&a.c_role)||"").replace(/\bintern(ship)?\b/ig,"").trim();

  if(co&&new RegExp(co.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i").test(t))good.push({t:`Mentions ${co}`,d:"It’s clearly written for this company."});else if(co)bad.push({t:`Doesn’t mention ${co}`,d:"Reads like it could go to any company."});

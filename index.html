<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Landit</title>
<meta name="description" content="A week-by-week plan to land your internship, one clear step at a time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&family=Inter+Tight:wght@800;900&family=Archivo:wght@800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: quiet left rail + one dominant "next step" card; six indicators as soft rings with an uncertainty band; everything else is calm cards on a cool mineral ground */
/* Layout: black ground, huge geometric type, one glowing "signal orb" as the signature; white bands on the landing page only */
/* Layout: pure white page, black geometric type; dark objects (photo cards, the one-thing card, check-in) sit on it like photos */
:root,.light{
  --bg:#FFFFFF; --surface:#F5F6F7; --surface-2:#ECEEF0; --track:#E5E8EB;
  --ink:#050505; --muted:#52585E; --faint:#8E949A; --line:#E6E8EB;
  --accent:#3A4DFF; --accent-ink:#FFFFFF; --accent-soft:#ECEEFF; --signal:#0E9F5E; --orb:#3DF5A8;
  --hero:#0A0D10; --hero-2:#12161B; --hero-ink:#F3F5F6; --hero-muted:#9BA4AC; --hero-line:#222930; --hero-accent:#3DF5A8;
  --good:#0E9F5E; --warn:#B7790F; --bad:#D7355A;
  --c-clarity:#3A4DFF; --c-evidence:#0E9F5E; --c-network:#D98A00; --c-positioning:#7A4FD6; --c-execution:#E23D63; --c-interview:#0F93C2;
  --f-display:"Figtree","Proxima Nova","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Proxima Nova","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:22px; --r-sm:12px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 20px 50px -24px rgba(0,0,0,.18);
  color-scheme:light;
}
.checkcard{color:var(--ink)}
.dk,.hero,.pcard,.checkcard,.scene{
  --bg:#050607; --surface:#0D1013; --surface-2:#161A1F; --track:#20262C;
  --ink:#F3F5F6; --muted:#9BA4AC; --faint:#626B73; --line:#1E2429;
  --accent:#5B6CFF; --accent-soft:#141A40; --signal:#3DF5A8;
  --good:#3DF5A8; --warn:#FFB547; --bad:#FF5C7A;
  --c-clarity:#7C89FF; --c-evidence:#3DF5A8; --c-network:#FFB547; --c-positioning:#C38CFF; --c-execution:#FF5C7A; --c-interview:#4FD3FF;
  color-scheme:dark;
}
.light{background:var(--bg);color:var(--ink)}
.dk{background:var(--bg);color:var(--ink)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:500;letter-spacing:-.025em;line-height:1.08;text-wrap:balance;margin:0}
p{margin:0}
ul,ol{margin:0;padding:0}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-feature-settings:"tnum";font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.small{font-size:13px}
.muted{color:var(--muted)}

/* Shell: one narrow column, top bar, nothing on the sides */
.app{max-width:860px;margin:0 auto;padding-block:18px 64px;display:flex;flex-direction:column}
.app.bare{max-width:1080px;padding-block:28px 96px}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:32px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.03em}
.brand svg{flex:none;width:20px;height:20px}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:7px 13px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:500;font-size:15px;white-space:nowrap}
.nav a:hover{color:var(--ink);background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.top{border-bottom-color:var(--line)}
.seg{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:9px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:7px;font-size:13px;color:var(--muted);cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.link{border:0;background:none;padding:0;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);font-size:13px;text-align:left}
.link:hover{color:var(--ink)}
.foot{margin-top:64px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--faint)}
@media (max-width:640px){.top{gap:10px;margin-bottom:24px}.nav{order:3;width:100%}.hero .rings{display:none}}

/* Home */
.hi{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.hi h1{font-size:clamp(56px,11vw,110px);font-weight:400;letter-spacing:-.04em;line-height:.95}
.hi p{font-size:19px;color:var(--muted)}
.hero .one{font-size:18px;color:var(--hero-ink);font-weight:500;max-width:52ch}
.hero .how{display:flex;flex-direction:column;gap:18px;border-top:1px solid var(--hero-line);padding-top:20px;animation:rise .3s ease both}
.hero .how .reason{font-size:16px}
.hero .qlist li{font-size:16px}
.hero .qlist li::before{color:var(--hero-accent)}
.hero .draft{background:var(--hero-2);color:var(--hero-ink);border:1px solid var(--hero-line)}
.hero .link{color:var(--hero-muted);text-decoration-color:var(--hero-line)}
.hero .btn.light{font-size:16px;padding:14px 24px}
.quick{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.quickbtn{display:inline-flex;align-items:center;gap:8px;padding:6px 15px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:15px}
.quickbtn:hover{border-color:var(--ink)}
.quickbtn .glyph{width:30px;height:30px;border-radius:50%}
.focus-top{max-width:680px;width:100%;margin:0 auto 4px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.mini{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.inds.compact .ind{padding:12px 14px;gap:12px}
.ring-pct{position:relative;display:inline-grid;place-items:center;flex:none}
.ring-pct b{position:absolute;font-size:12.5px;font-weight:500;color:var(--ink)}
.ind-level{font-variant-numeric:tabular-nums}
/* Typography blocks */
.page-head{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;max-width:62ch}
.page-head h1{font-size:clamp(32px,4.6vw,48px)}
.lede{font-size:18px;color:var(--muted);line-height:1.5;max-width:60ch}
.sec{display:flex;flex-direction:column;gap:16px;margin-top:44px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.sec-head h2{font-size:24px}
.sec-head p{color:var(--muted);font-size:14px;max-width:52ch}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font-size:19px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.quote{font-family:var(--f-display);font-size:21px;line-height:1.25;letter-spacing:-.015em;font-weight:500}

/* Buttons & chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:14px 26px;font-family:var(--f-display);font-weight:800;font-size:13.5px;letter-spacing:.16em;text-transform:uppercase;border:1px solid transparent;cursor:pointer;text-decoration:none;line-height:1.2;transition:transform .12s ease,background .15s ease,box-shadow .2s ease}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.light{background:var(--hero-ink);color:#050607}
.btn.outline-light{background:transparent;color:var(--hero-ink);border-color:var(--hero-line)}
.btn.outline-light:hover{background:var(--hero-2)}
.btn.black{background:#050607;color:#fff}
.btn.sm{padding:10px 16px;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;font-size:15px;cursor:pointer;font-weight:500;color:var(--ink);transition:background .12s,border-color .12s}
.chip:hover{border-color:var(--faint)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .ct{font-family:var(--f-mono);font-size:11.5px;opacity:.7;margin-left:6px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:500;white-space:nowrap}
.tag.like{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.tag.drain{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}

/* Hero next step */
.hero{background:radial-gradient(120% 90% at 85% 50%,var(--hero-2),var(--hero) 60%);border:1px solid var(--hero-line);color:var(--hero-ink);border-radius:28px;padding:clamp(24px,4vw,44px);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:18px;isolation:isolate}
.hero .rings{position:absolute;right:-110px;top:-110px;width:380px;height:380px;z-index:-1;opacity:.9;pointer-events:none}
.hero .eyebrow{color:var(--hero-muted)}
.hero .avoid{display:inline-flex;align-items:center;gap:10px;font-size:15px;color:var(--hero-muted);font-weight:500}
.hero .avoid i{width:18px;height:2px;background:var(--hero-accent);display:inline-block}
.hero h2{font-size:clamp(30px,4.4vw,48px);max-width:18ch;font-weight:500;letter-spacing:-.035em}
.hero .reason{font-size:17px;color:var(--hero-muted);max-width:58ch;line-height:1.55}
.hero .reason b{color:var(--hero-ink);font-weight:600}
.hero .action{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;background:var(--hero-2);border:1px solid var(--hero-line);border-radius:16px;max-width:620px}
.hero .action .t{font-family:var(--f-mono);font-size:12px;color:var(--hero-accent);padding-top:3px;white-space:nowrap}
.hero .action p{font-size:16.5px;font-weight:500}

/* Indicators */
.inds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.inds{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ind{display:flex;gap:14px;align-items:center;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;min-width:0}
.ind:hover{border-color:var(--faint)}
.ind[aria-expanded="true"]{border-color:var(--ink)}
.ind-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.ind-name{font-weight:600;font-size:15px}
.ind-level{font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.trend{font-family:var(--f-mono);font-size:12px}
.trend.up{color:var(--good)}.trend.down{color:var(--bad)}.trend.flat{color:var(--faint)}
@media (max-width:460px){.ind{flex-direction:column;align-items:flex-start;gap:8px}}
.ind-detail{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;padding:22px;border-radius:18px;background:var(--surface);border:1px solid var(--ink)}
@media (max-width:760px){.ind-detail{grid-template-columns:minmax(0,1fr)}}
.ind-detail ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.ind-detail li{display:flex;gap:8px;font-size:14.5px}
.ind-detail li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--faint);margin-top:9px;flex:none}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .ttl{font-weight:500}
.li .sub{font-size:13.5px;color:var(--muted)}
.glyph{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--ink)}

/* Flow (conversational questions) */
.flow{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:28px;padding-top:8px}
.flow-top{display:grid;grid-template-columns:72px minmax(0,1fr) 72px;gap:14px;align-items:center}
.flow-top .mono{text-align:right;color:var(--faint)}
.bar{height:4px;border-radius:4px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s ease}
.note{border-left:2px solid var(--accent);padding:4px 0 4px 16px;display:flex;flex-direction:column;gap:6px;animation:rise .45s ease both}
.note p{font-size:16.5px;color:var(--ink);line-height:1.5}
.q-wrap{display:flex;flex-direction:column;gap:20px;animation:rise .4s ease both}
.q{font-size:clamp(26px,3.6vw,36px);font-weight:600;line-height:1.12}
.q-sub{color:var(--muted);font-size:16px;margin-top:-8px}
.q-body{display:flex;flex-direction:column;gap:14px}
.q-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.q-err{color:var(--bad);font-size:14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:16.5px;font-weight:500}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt .arr{color:var(--faint);font-family:var(--f-mono)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13.5px;color:var(--muted);font-weight:500}
.input,.ta,select.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;font-size:16px;line-height:1.45}
.ta{min-height:110px;resize:vertical}
.input:focus,.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button{padding:14px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:16px;cursor:pointer}
.scale button:hover{border-color:var(--ink)}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scale-labels{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.srow{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0;padding-top:0}
.srow .lbl{font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}


/* Signal orb */
.orb{position:relative;width:var(--size,280px);max-width:100%;aspect-ratio:1;display:grid;place-items:center;flex:none}
.orb canvas{position:absolute;inset:0;width:100%;height:100%}
.orb-txt{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.orb-txt b{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,calc(var(--size,280px)*.17),72px);letter-spacing:-.03em;line-height:1;color:#F3F5F6}
.orb-txt span{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#C9CED3}
.orb-txt em{font-style:normal;font-size:13px;color:var(--signal);font-weight:500}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center}
.hero-grid .orb{--size:260px}
@media (max-width:760px){.hero-grid{grid-template-columns:minmax(0,1fr)}.hero-grid .orb{--size:220px;order:-1;justify-self:center}}
.wordmark{font-family:var(--f-display);font-weight:800;letter-spacing:.2em;text-transform:uppercase;font-size:13px}
.top .nav a{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.12em;font-size:12.5px;font-weight:600}

/* Landing */
.land{display:flex;flex-direction:column}
.band{margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto;width:100%}
.lnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.lnav .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-block:16px}
.lnav-links{display:flex;gap:34px}
.lnav-links button{background:none;border:0;color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;padding:6px 0}
.lnav-links button:hover{color:var(--accent)}
@media (max-width:820px){.lnav-links{display:none}}
.lhero{position:relative;overflow:hidden;background:var(--bg)}
.lhero .wrap{position:relative;padding-block:clamp(88px,13vw,170px) clamp(72px,10vw,130px);display:flex;flex-direction:column;gap:28px}
.lhero .orb{position:absolute;right:-150px;top:50%;transform:translateY(-50%);--size:min(560px,58vw);opacity:.95;pointer-events:none}
.lhero .orb .orb-txt{display:none}
@media (max-width:820px){.lhero .orb{right:-45%;top:14%;--size:340px;opacity:.25}}
.mega{font-family:var(--f-display);font-weight:400;font-size:clamp(46px,8.4vw,124px);line-height:.98;letter-spacing:-.035em;max-width:13ch;text-wrap:balance}
.big{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,6.6vw,96px);line-height:1;letter-spacing:-.03em;max-width:16ch;text-wrap:balance}
.lsub{font-size:clamp(17px,1.6vw,21px);line-height:1.5;max-width:46ch;color:var(--muted)}

.lsec{padding-block:clamp(72px,10vw,140px) 0}
.lsec .wrap{display:flex;flex-direction:column;gap:28px}
.showcase{border-radius:32px;overflow:hidden;position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:24px;padding:clamp(28px,5vw,64px);min-height:520px;margin-top:20px;
  background:radial-gradient(70% 90% at 30% 50%,#0F1A17 0%,#050607 70%);border:1px solid #1E2429}
.showcase::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
.showcase>*{position:relative}
.showcase .orb{--size:400px;justify-self:center}
@media (max-width:820px){.showcase{grid-template-columns:minmax(0,1fr);min-height:0}.showcase .orb{--size:300px}}
.arc{display:flex;flex-direction:column;gap:18px}
.arc-row{display:grid;grid-template-columns:70px minmax(0,1fr);gap:14px;align-items:baseline}
.arc-row .m{font-family:var(--f-mono);font-size:12px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.arc-row p{font-family:var(--f-display);font-size:clamp(19px,2vw,24px);font-weight:400;letter-spacing:-.015em;line-height:1.25}
.arc-row.now p{color:var(--signal)}

.dm-app{display:grid;grid-template-columns:190px minmax(0,1fr) 280px;min-height:560px;text-align:left;color:#050505}
.dm-side{background:#F7F8F9;border-right:1px solid #ECEEF0;padding:18px 14px;display:flex;flex-direction:column;gap:18px}
.dm-nav{display:flex;flex-direction:column;gap:2px;font-size:12.5px;font-weight:500;color:#52585E}

.dm-plan li{display:flex;align-items:center;gap:8px}.dm-plan li i{width:8px;height:8px;border-radius:50%;border:1.5px solid #C9CED3;flex:none}
.dm-plan li.now{color:var(--accent);font-weight:600}.dm-plan li.now i{background:var(--accent);border-color:var(--accent)}
.dm-plan li.done i{background:var(--good);border-color:var(--good)}
.dm-me{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}.dm-me img{width:28px;height:28px;border-radius:50%;object-fit:cover;object-position:center 20%}.dm-me em{font-style:normal;font-weight:400;color:#8E949A;font-size:11px}
.dm-main{padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.dm-hi{font-family:var(--f-display);font-size:36px;letter-spacing:-.04em;line-height:1;margin:0}
.dm-muted{color:#6B7177}

.dm-one .orb-txt b{font-size:24px!important}.dm-one .orb-txt span{font-size:7.5px}
.dm-title{font-family:var(--f-display);font-size:22px;letter-spacing:-.02em;line-height:1.1;margin:0}
.dm-small{font-size:11px;color:var(--muted)}
.dm .btn.sm{padding:7px 12px;font-size:9.5px}
.dm-card{border:1px solid #E6E8EB;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff}

.dm-inds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dm-ind{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid #E6E8EB;border-radius:10px;background:#F7F8F9;font-size:11px;font-weight:600;min-width:0}

.dm-check .person{grid-template-columns:28px minmax(0,1fr) auto;gap:8px}.dm-check .av{width:28px;height:28px}.dm-check .li-btn{width:18px;height:18px}

.sl-x{display:inline-block;position:relative;color:var(--signal);text-align:center;font-variant-numeric:tabular-nums;vertical-align:bottom;overflow:hidden;line-height:.9;padding:0 .02em .02em}

.sl-num.out{animation:slOut .35s ease-in both}
@keyframes slIn{from{transform:translateY(70%);opacity:0}to{transform:none;opacity:1}}

/* Simple dashboard */
.hi{margin-bottom:18px}
.cd{display:flex;flex-direction:column;gap:12px;padding:20px 22px;border:1px solid var(--line);border-radius:18px;background:var(--surface);margin-bottom:16px}
.cd-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.cd-big{font-family:var(--f-display);font-size:clamp(24px,3vw,32px);font-weight:600;letter-spacing:-.03em}
.cd-meta{font-size:14px;color:var(--muted)}.cd-meta b{color:var(--ink)}
.cd-bar{position:relative;height:10px;border-radius:6px;background:var(--track)}

.cd-bar s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--surface);transform:translateX(-1px)}
.cd-steps{position:relative;display:flex;gap:4px;padding-top:2px}
.cd-step{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}

.cd-step b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.cd-bot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:14.5px}
.one-card{gap:14px}
.one-card h2{max-width:22ch}
.ck-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px;border:1px solid var(--line);border-radius:18px;margin-top:16px;font-size:15px;flex-wrap:wrap}
.more-row{margin-top:18px}
.dm-simple{padding:26px clamp(16px,4vw,56px) 48px;display:flex;flex-direction:column;gap:16px;max-width:none;margin:0 auto;text-align:left;color:#050505}
.dm-top{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid #EEF0F2}

.dm-onecard{padding:22px;border-radius:18px}
.dm-people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.dm-people .av{width:30px;height:30px}.dm-people .li-btn{width:18px;height:18px}
.dm-simple .ck-row{margin-top:0;padding:14px 18px;border-color:#E6E8EB}
@media (max-width:620px){.dm-people{grid-template-columns:minmax(0,1fr)}}


.odo{display:inline-flex;vertical-align:top;font-variant-numeric:tabular-nums;margin-inline:.06em}

/* Quiz: lime buttons, chunky tiles, game-like progress */
.btn.primary{background:#C6F432;color:#0A0B0C}
.btn.primary:hover{background:#B8EA1F;box-shadow:0 0 0 4px rgba(198,244,50,.35)}
.btn.primary:disabled{opacity:.5}
.flow .btn{border-radius:12px}
.bar{height:10px;border-radius:6px;background:#ECEEF0}

.flow-top .mono{color:var(--ink);font-weight:500}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tgrid .chip{border-radius:14px;padding:18px 18px;font-size:16.5px;font-weight:600;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;border-width:1.5px;transition:transform .12s,background .12s,border-color .12s}

.pickc{font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:-4px}

.opt:hover{border-color:#0A0B0C}

.joblink:hover{background:rgba(198,244,50,.16)}
.rchip{display:inline-block;margin-left:8px;padding:3px 9px;border-radius:999px;font-size:10.5px;letter-spacing:.08em;vertical-align:1px}

/* Dashboard two-column with pre-apply checklist */
.app.wide{max-width:1240px}
.dash-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.dash-main{min-width:0}
.dash-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
@media (max-width:980px){.dash-grid{grid-template-columns:minmax(0,1fr)}.dash-side{position:static}}
.cl{border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
.cl-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cl-count{font-family:var(--f-display);font-weight:700;font-size:18px}
.cl-bar{height:8px;border-radius:6px;background:#ECEEF0;overflow:hidden}
.cl-bar i{display:block;height:100%;background:#C6F432;transition:width .3s ease}
.cl-list{list-style:none;display:flex;flex-direction:column;gap:4px}
.cl-item{width:100%;display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;align-items:start;text-align:left;padding:12px 10px;border-radius:12px;border:0;background:transparent;cursor:pointer}
.cl-item:hover{background:var(--surface)}
.cl-item b{font-size:15px;font-weight:600}
.cl-item span span{font-size:13px;color:var(--muted);line-height:1.4}
.cl-box{width:22px;height:22px;border-radius:7px;border:1.5px solid #C9CED3;margin-top:1px;display:grid;place-items:center;transition:background .15s,border-color .15s}
.cl-box::after{content:attr(data-n);font-size:12px;font-weight:700;color:var(--muted)}
.cl-item[aria-pressed="true"] .cl-box{background:#C6F432;border-color:#0A0B0C}
.cl-item[aria-pressed="true"] .cl-box::after{content:"✓";font-size:13px;font-weight:800;color:#0A0B0C}
.cl-item[aria-pressed="true"] b{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.cl-foot{font-size:13.5px;font-weight:600}


.cl-mods{list-style:none;display:flex;flex-direction:column;gap:8px}
.mod{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;transition:border-color .2s,background .2s}
.mod-row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center}
.mod-row b{font-size:15px;font-weight:600}
.mod-n{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12.5px;font-weight:800;background:var(--surface-2);color:var(--muted)}
.mod.now{border-color:#0A0B0C;background:#FBFFF0;box-shadow:0 8px 20px -14px rgba(0,0,0,.4)}
.mod.now .mod-n{background:#0A0B0C;color:#C6F432}
.mod.done{background:var(--surface)}
.mod.done .mod-n{background:#C6F432;color:#0A0B0C}
.mod.done b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.mod.locked{opacity:.55;border-style:dashed}
.mod.locked .mod-n{background:transparent;border:1.5px solid var(--line)}
.mod-h{font-size:13.5px;color:var(--muted);line-height:1.45;padding-left:36px}
.mod-btn{align-self:flex-start;margin-left:36px;border-radius:10px}
.mod-lock{font-size:12px;color:var(--faint);padding-left:36px;margin-top:-4px}
.mod-undo{font-size:12px}
.sd{max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.sd-hi{display:flex;flex-direction:column;gap:10px}
.sd-hi h1{font-size:clamp(52px,10vw,88px);font-weight:500;letter-spacing:-.045em;line-height:.95}
.sd-hi p{font-size:18px;color:var(--muted);line-height:1.45}.sd-hi b{color:var(--ink)}
.sd-prog{display:flex;align-items:center;gap:14px}
.sd-bar{flex:1;display:flex;gap:5px}
.sd-bar i{flex:1;height:10px;border-radius:5px;background:var(--track)}
.sd-bar i.done{background:#C6F432}.sd-bar i.now{background:#0A0B0C}
.sd-prog span{font-size:14px;font-weight:700;white-space:nowrap}
.sd-now{border-radius:22px;padding:clamp(22px,4vw,32px);background:#FBFFF0;border:2px solid #0A0B0C;display:flex;flex-direction:column;gap:12px}
.sd-now.late{background:#FFF7F6}
.sd-eye{font-size:12.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sd-now.late .sd-eye{color:#B42318}
.sd-now h2{font-size:clamp(28px,4.4vw,38px);font-weight:700;letter-spacing:-.03em}
.sd-now p{font-size:17px;line-height:1.5;color:var(--muted)}
.sd-acts{display:flex;align-items:center;gap:18px;margin-top:6px;flex-wrap:wrap}
.btn.big{white-space:nowrap;font-size:15px;font-weight:800;letter-spacing:.12em;padding:16px 30px;border-radius:14px}
.sd-list{list-style:none;display:flex;flex-direction:column}
.sd-list li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);font-size:16px}
.sd-n{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--faint);border:1.5px solid var(--line)}
.sd-list li.done .sd-n{background:#C6F432;border-color:#C6F432;color:#0A0B0C}

.sd-d{font-size:13px;color:var(--faint);font-family:var(--f-mono)}
.sd-foot{font-size:13px}

.sd-mock .sd-hi h1{font-size:clamp(40px,6vw,64px)}
.sd-mock .sd-list li:nth-child(n+4){display:none}
.mod-title{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.mod-title:hover b{text-decoration:underline;text-underline-offset:3px}
.mod-sub{font-size:12px;padding-left:36px;margin-top:-2px}
.mod-acts{display:flex;align-items:center;gap:14px;margin-left:36px;flex-wrap:wrap}
.mod-acts .mod-btn{margin-left:0}

/* Workshop */
.wk{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.wk-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.wk-parts{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;font-weight:600;color:var(--faint)}
.wk-part.on{color:var(--ink)}
.wk-part.done{color:var(--muted)}
.wk-part.done::before{content:"✓ "}
.wk-bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.wk-bar i{display:block;height:100%;background:#C6F432;border-radius:3px;transition:width .3s ease}
.wk-slide{display:flex;flex-direction:column;gap:18px;min-height:420px;padding:8px 0 4px;animation:wkin .25s ease}
@keyframes wkin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.wk-slide{animation:none}}
.wk-eye{font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

const ROLE={"Consulting":"consultant","Product management":"Product Manager","Product marketing":"Product Marketing Manager","Brand marketing":"Brand Manager","UX research":"UX Researcher","Internal strategy":"strategy lead inside a company","Data analytics":"Data Analyst","Finance":"financial analyst","Sales":"account executive","Software engineering":"software engineer","Policy / nonprofit":"program manager at a nonprofit","Media / journalism":"reporter or editor","Fashion & retail":"merchandiser or buyer","Healthcare":"healthcare operations manager","Education":"teacher or learning designer","Startups / venture":"early employee at a startup"};

function likeCounts(p,asOf){const c={};p.activities.forEach(a=>{if(asOf&&a.date>asOf)return;(a.like||[]).forEach(t=>c[t]=(c[t]||0)+1)});return c}
function drainCounts(p){const c={};p.activities.forEach(a=>(a.drain||[]).forEach(t=>c[t]=(c[t]||0)+1));(p.passed||[]).forEach(x=>{if(x.reason&&DRAIN[x.reason])c[x.reason]=(c[x.reason]||0)+1});return c}
function stats(p,asOf=TODAY){
  const A=p.activities.filter(a=>a.date<=asOf),b=p.base||{};
  const apps=A.filter(a=>a.type==="application");
  return{apps:(b.apps||0)+sum(apps.map(a=>a.count||1)),replies:(b.replies||0)+sum(apps.map(a=>a.replies||0)),
    interviews:(b.interviews||0)+A.filter(a=>a.type==="interview").length,offers:b.offers||0,
    chats:(b.chats||0)+A.filter(a=>a.type==="coffee").length};
}
function careerStates(p,asOf=TODAY){
  const m={};
  const add=c=>m[c]||(m[c]={name:c,acts:[],chats:0,interest:null,hist:[],last:null,seed:null});
  (p.careers||[]).forEach(c=>{if(c.since&&c.since>asOf)return;const s=add(c.name);s.seed=c.interest;s.since=c.since});
  p.activities.filter(a=>a.career&&a.date<=asOf).sort(byDate).forEach(a=>{
    const s=add(a.career);s.acts.push(a);if(a.type==="coffee")s.chats++;s.last=a.date;
    if(a.before!=null&&!s.hist.length)s.hist.push({d:a.date,v:a.before});
    if(a.after!=null){s.hist.push({d:a.date,v:a.after});s.interest=a.after}
  });
  Object.values(m).forEach(s=>{if(s.interest==null)s.interest=s.seed??3;if(!s.hist.length)s.hist.push({d:s.since||TODAY,v:s.interest});if(!s.last)s.last=s.since||""});
  return Object.values(m);
}
function findTension(p){
  const lc=likeCounts(p),dc=drainCounts(p);let best=null,bs=0;
  TENSIONS.forEach(t=>{const a=lc[t.like]||0,b=sum(t.drains.map(d=>dc[d]||0));const s=Math.min(a,b);if(s>bs){bs=s;best=Object.assign({a,b},t)}});
  return best;
}

function indicators(p,asOf=TODAY){

    network:{v:network,basis:[`${chats90} conversation${chats90===1?"":"s"} in the last 90 days`,`${events90} career event${events90===1?"":"s"} in the last 90 days`,`Networking confidence: ${c.network||"?"}/5`],moves:"One real conversation a week is plenty. Follow up with the people you’ve already met."},
    positioning:{v:positioning,basis:[`Resume confidence: ${c.resume||"?"}/5`,st.apps?`${st.replies} of ${st.apps} applications got a reply (${Math.round(rate*100)}%)`:"No applications logged yet"],moves:"Get your direction clearer first. Then rewrite the top third of your resume for one role."},
    execution:{v:execution,basis:[`${acts30} activit${acts30===1?"y":"ies"} logged in the last 30 days`,`${checks} weekly check-in${checks===1?"":"s"} in the last 4 weeks`],moves:"Small and steady. Two actions a week beats one weekend binge."},
    interview:{v:interview,basis:[`Interview confidence: ${c.interview||"?"}/5`,`${st.interviews} interview${st.interviews===1?"":"s"} so far, ${st.offers} offer${st.offers===1?"":"s"}`],moves:"Three stories you can tell in 90 seconds each, practiced out loud."},
  };

}

  return{st,cs,lc,dc,I,recentApps:sum(recent.filter(a=>a.type==="application").map(a=>a.count||1)),chats30:recent.filter(a=>a.type==="coffee").length,tension:findTension(p),rate:st.apps?st.replies/st.apps:null};
}

function plan(p){
  const t=p.target;if(!t)return null;
  const ps=p.planStart||TODAY,start=t.start,deadline=(p.deadline&&p.deadline<start)?p.deadline:addDays(start,-84),D=daysBetween(ps,deadline);

    const a=ps,b=addDays(a,d1),c=addDays(b,d2),d=addDays(c,d3);

  const cur=phases.find(x=>TODAY>=x.from&&TODAY<x.to)||(TODAY<phases[0].from?phases[0]:phases[phases.length-1]);

}

function nextStep(p){
  const x=ctxFor(p),{st,I,rate}=x,g=p.goal,pl=plan(p);

function spark(hist,w=180,h=56){
  if(!hist.length)return"";

let orbRaf=0;
function orb(v,label,sub,size){return `<div class="orb"${size?` style="--size:${size}px"`:""}><canvas data-orb aria-hidden="true"></canvas><div class="orb-txt"><b>${v}</b>${label?`<span>${label}</span>`:""}${sub?`<em>${sub}</em>`:""}</div></div>`}
function initOrbs(){
  cancelAnimationFrame(orbRaf);
  document.querySelectorAll("canvas[data-bokeh]").forEach(drawBokeh);
  const cs=[...document.querySelectorAll("canvas[data-orb]")];if(!cs.length)return;
  const col=getComputedStyle(document.documentElement).getPropertyValue("--orb").trim()||"#3DF5A8";
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const items=cs.map(c=>{const r=c.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1),w=Math.max(20,r.width),h=Math.max(20,r.height);c.width=w*d;c.height=h*d;const ctx=c.getContext("2d");ctx.setTransform(d,0,0,d,0,0);
    const n=Math.round(Math.min(900,w*1.6));const pts=[];for(let i=0;i<n;i++){const e=Math.pow(Math.random(),.45);pts.push({a:Math.random()*6.2832,r:.3+.7*e,s:Math.random()*1.7+.5,o:Math.random()*.7+.3,sp:(Math.random()-.5)*.00012,ph:Math.random()*6.28})}
    return{ctx,w,h,pts}});
  const draw=t=>items.forEach(({ctx,w,h,pts})=>{
    ctx.clearRect(0,0,w,h);const cx=w/2,cy=h/2,R=Math.min(w,h)*.4;
    const def=a=>1+.035*Math.sin(3*a+t*.0005)+.025*Math.sin(5*a-t*.0008);
    const g=ctx.createRadialGradient(cx,cy,R*.1,cx,cy,R*1.25);g.addColorStop(0,"rgba(0,0,0,.96)");g.addColorStop(.78,"rgba(0,0,0,.9)");g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.globalAlpha=1;ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*1.25,0,6.2832);ctx.fill();
    ctx.beginPath();for(let i=0;i<=144;i++){const a=i/144*6.2832,rr=R*def(a);i?ctx.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr):ctx.moveTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}
    ctx.strokeStyle=col;ctx.globalAlpha=.7;ctx.lineWidth=2;ctx.shadowColor=col;ctx.shadowBlur=22;ctx.stroke();ctx.shadowBlur=0;
    ctx.fillStyle=col;
    pts.forEach(p=>{const a=p.a+t*p.sp,rr=R*def(a)*p.r;ctx.globalAlpha=p.o*p.r*p.r*(.55+.45*Math.sin(t*.0015+p.ph));ctx.beginPath();ctx.arc(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,p.s*(.5+.5*p.r),0,6.2832);ctx.fill()});
    ctx.globalAlpha=1;
  });
  if(reduce){draw(0);return}
  const loop=t=>{draw(t);orbRaf=requestAnimationFrame(loop)};loop(performance.now());
}

/* ---------- flow engine (one question at a time) ---------- */
function makeFlow(qs,onDone,ctx){const f={qs,a:{},stack:[],idx:-1,note:null,onDone,ctx:ctx||{},done:false};f.idx=nextIdx(f,-1);return f}
function nextIdx(f,i){for(let j=i+1;j<f.qs.length;j++){const q=f.qs[j];if(!q.when||q.when(f.a,f.ctx))return j}return -1}
function V(f,x){return typeof x==="function"?x(f.a,f.ctx):x}
function advance(f){
  const q=f.qs[f.idx],note=q.coach?q.coach(f.a,f.ctx):null;
  f.stack.push(f.idx);const n=nextIdx(f,f.idx);
  if(n<0){f.done=true;f.onDone(f)}else{f.idx=n;f.note=note||null}
  render();
}
function validate(f){
  const q=f.qs[f.idx],v=f.a[q.id];
  if(q.kind==="fields"&&q.validate){const e=q.validate(v||{});if(e)return e}
  if(q.optional)return null;
  if(q.kind==="fields"&&q.validate){const e=q.validate(v||{});if(e)return e}
  if(q.kind==="date"&&!v)return "Pick a date, or go back and choose “Not sure”.";
  if(q.kind==="text"&&q.required&&!String(v||"").trim())return "Type a word or two so I have something to work with.";
  if(q.kind==="context"&&!String((v||{}).title||"").trim())return "Add a short title so you’ll recognize it later.";
  if((q.kind==="multi"||q.kind==="tags")&&q.min&&!(v||[]).length&&!String(f.a[q.id+"Text"]||"").trim())return "Pick at least one, or type your own.";
  if(q.kind==="sliders"||q.kind==="interest"){const keys=q.kind==="interest"?["before","after"]:q.items.map(i=>i.k);if(keys.some(k=>!(v&&v[k])))return "Pick a number on each row.";}
  if(q.kind==="choice"&&!v)return "Pick one to continue.";
  return null;
}
function optList(q,f){
  if(q.kind==="tags"){const src=q.set==="like"?LIKE:DRAIN,pc=q.set==="like"?likeCounts(P()):drainCounts(P());const keys=(q.keys||Object.keys(src)).slice().sort((a,b)=>(pc[b]||0)-(pc[a]||0));return keys.map(k=>({v:k,label:src[k][0],ct:f.ctx.showCounts?pc[k]:0}))}

}

  logout:async()=>{if(sb)await sb.auth.signOut();delete S.profiles.you;S.active="sample";try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}AUTH.user=null;toast("Logged out");go("welcome")},
  wkrdl:async()=>{const url="img/wk/amelia-resume-template.pdf";let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){}
    if(!dl){window.open(url,"_blank","noopener");return}
    try{const blob=await (await fetch(url)).blob();await dl.save({filename:"Resume-Template.pdf",data:blob});toast("Template saved")}catch(e){if(e&&e.code==="declined")return;if(e&&e.code==="rate_limited"){toast("One moment, then try again.");return}window.open(url,"_blank","noopener")}},
  wktick:el=>{const w=wkData(P());w[el.dataset.k]=!w[el.dataset.k];save();render()},
  wkptimer:el=>{const c=document.getElementById("wkp-clock");if(!c)return;clearInterval(wkGo.tm);let t=30;c.textContent="0:30";c.classList.remove("done");el.textContent="Restart";wkGo.tm=setInterval(()=>{t--;if(!c.isConnected){clearInterval(wkGo.tm);return}c.textContent="0:"+String(Math.max(t,0)).padStart(2,"0");if(t<=0){clearInterval(wkGo.tm);c.classList.add("done");c.textContent="Time!"}},1000)},
  wkpoll:el=>{wkData(P()).poll=el.dataset.v;save();wkGo(1)},
  wkjump:el=>{const i=wkSlides().findIndex(x=>x.id===el.dataset.id);if(i>=0){wkData(P()).i=i;save();render();window.scrollTo(0,0)}},
  wkcar:el=>{const t=el.closest(".wk-car").querySelector(".wk-car-track");t.scrollBy({left:+el.dataset.d*t.clientWidth,behavior:"smooth"})},
  wkset:el=>{const w=wkData(P());w[el.dataset.k]=el.dataset.v;save();render()},
  wkobj:el=>{const w=wkData(P()),a=w.obj||(w.obj=[]),v=el.dataset.v,j=a.indexOf(v);j<0?a.push(v):a.splice(j,1);save();render()},
  wkopen:el=>{const p=P(),w=wkData(p),i=+el.dataset.i;w.open=i;w.note=`Hi [Name], ${WK_OPEN[i].replace(/…$/,"")} [something specific]. I’m a student at [your school] and think I could learn a lot from you.`;save();render()},
  wkcopy:el=>{const v=wkData(P())[el.dataset.k]||"";if(navigator.clipboard)navigator.clipboard.writeText(v).then(()=>toast("Copied"),()=>toast("Couldn’t copy. Select it and copy manually."));else toast("Select it and copy manually.")},
  wkexit:()=>{toast("Saved. Pick up where you left off.");go("today")},
  wkdone:()=>{const p=P(),c=p.checklist||(p.checklist={}),k=curW().done,i=CHECK.findIndex(x=>x.k===k);if(!c[k]){c[k]=true;save();const nx=CHECK[i+1];toast("Done ✓"+(nx?" Next: "+ckT(nx,p).replace(/^./,m=>m.toLowerCase()):""))}go("today")},
  editdl:()=>{UI.editDl=true;render()},
  toggleind:()=>{UI.showInd=!UI.showInd;UI.ind=null;render()},
  savedl:()=>{const v=document.getElementById("dl-input").value;if(!v){toast("Pick a date first");return}const p=P();p.deadline=v;p.planStart=p.planStart||TODAY;UI.editDl=false;save();toast("Plan rebuilt around "+fmt(v));render()},
  resetdl:()=>{const p=P();p.deadline=null;UI.editDl=false;save();toast("Using a typical date");render()},
  scrollto:el=>{const t=document.getElementById(el.dataset.id);if(t)t.scrollIntoView({behavior:"smooth",block:"start"})},
  featmore:el=>{const c=el.closest(".pcard"),o=c.classList.toggle("open");el.setAttribute("aria-expanded",o);el.textContent=o?"×":"+"},
  carousel:el=>{const c=el.parentElement.querySelector(".carousel");if(c)c.scrollBy({left:Math.min(440,c.clientWidth*.85),behavior:"smooth"})},
  startcheck:()=>{startCheck();render();window.scrollTo(0,0)},
  cancel:()=>{clearHome();render();window.scrollTo(0,0)},
  home:()=>{clearHome();if(location.hash!=="#today")location.hash="today";else{render();window.scrollTo(0,0)}},
  smaller:()=>{UI.smaller=!UI.smaller;render()},
  copy:el=>{const t=document.getElementById(el.dataset.target);const txt=t.textContent;const sel=()=>{const r=document.createRange();r.selectNodeContents(t);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Selected. Copy it with your keyboard.")};
    try{navigator.clipboard.writeText(txt).then(()=>toast("Copied"),sel)}catch(e){sel()}},
  logtype:el=>{clearHome();startLog(el.dataset.v,{});render();window.scrollTo(0,0)},
  hidepat:el=>{ensureArr(P(),"hidden").push(el.dataset.id);save();toast("Hidden. I’ll weigh it less.");render()},
  answerq:el=>{const q=(P().questions||[]).find(x=>x.id===el.dataset.id);if(q){q.open=false;q.closed=TODAY;save();toast("Marked answered");render()}},
  hyp:()=>{const v=document.getElementById("hyp-input").value.trim();if(!v){toast("Write your current thinking first");return}ensureArr(P(),"beliefs").push({date:TODAY,text:v,short:trim(v,48).toLowerCase()});save();toast("Hypothesis updated");render()},
  oppf:el=>{UI.opp=el.dataset.v;render()},
  saveopp:el=>{const s=ensureArr(P(),"saved"),i=s.indexOf(el.dataset.id);if(i>=0)s.splice(i,1);else s.push(el.dataset.id);save();toast(i>=0?"Removed from saved":"Saved");render()},
  passask:el=>{UI.passing=el.dataset.id;render()},
  pass:el=>{ensureArr(P(),"passed").push({id:el.dataset.id,reason:el.dataset.v,date:TODAY});UI.passing=null;save();toast(el.dataset.v?"Got it. I’ll factor that in.":"Hidden");render()},
  // flow actions
  pick:el=>{if(!F)return;const q=F.qs[F.idx];F.a[q.id]=q.kind==="scale"?+el.dataset.v:el.dataset.v;advance(F)},
  pickk:el=>{if(!F)return;const q=F.qs[F.idx],o=F.a[q.id]||(F.a[q.id]={});o[el.dataset.k]=+el.dataset.v;el.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===el?"true":"false"))},
  toggle:el=>{if(!F)return;const q=F.qs[F.idx],arr=F.a[q.id]||(F.a[q.id]=[]),v=el.dataset.v,i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else{if(v==="none"){arr.length=0}else{const n=arr.indexOf("none");if(n>=0)arr.splice(n,1)}arr.push(v)}
    if(q.max&&arr.length>q.max)arr.shift();
    el.parentElement.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",arr.includes(b.dataset.v)?"true":"false"));
    const pc=document.getElementById("pickc");if(pc&&q.max)pc.textContent=arr.length?`${arr.length} of ${q.max} picked`+(arr.length===q.max?" · nice":""):`Pick up to ${q.max}`;
    if(q.max&&arr.length===q.max&&i<0){const at=F.idx;setTimeout(()=>{if(F&&F.idx===at)advance(F)},650)}},
  next:()=>{if(!F)return;const err=validate(F);if(err){const e=document.getElementById("q-err");e.textContent=err;e.hidden=false;return}advance(F);window.scrollTo({top:0,behavior:"smooth"})},
  skip:()=>{if(!F)return;advance(F)},
  back:()=>{if(!F||!F.stack.length)return;F.idx=F.stack.pop();F.note=null;render()},
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const fn=ACT[el.dataset.act];if(fn){e.preventDefault();fn(el,e)}});
document.addEventListener("input",e=>{const el=e.target;if(!el.dataset||!el.dataset.wk)return;const k=el.dataset.wk,w=wkData(P());w[k]=el.value;clearTimeout(wkGo.t);wkGo.t=setTimeout(save,300);
  const lv=document.querySelector(`[data-live="${k}"]`);if(lv){lv.textContent=el.value||lv.dataset.ph;lv.classList.toggle("wk-ph",!el.value)}
  const lh=document.querySelector(`[data-live-hint="${k}"]`);if(lh){lh.textContent=wkExpHint(el.value);lh.classList.toggle("ok",/\d/.test(el.value))}
  const lc=document.querySelector(`[data-live-count="${k}"]`);if(lc){lc.textContent=el.value.length+"/300";lc.classList.toggle("over",el.value.length>300)}
  if(route()==="contacts"){const p=P();document.querySelectorAll("[data-search-link]").forEach(a=>a.href=wkcURL(p,w));document.querySelectorAll("[data-search-q]").forEach(q=>q.textContent=wkcQ(p,w)||"Add a role to build your search");}
  if(k==="note"&&route()==="contacts")w.noteEdited=true;
  if(route()==="pitch"){w.pitch=wkpText(w);const lp=document.querySelector("[data-live-pitch]");if(lp)lp.innerHTML=wkpHTML(w);const ls=document.querySelector("[data-live-stats]");if(ls){const st=wkpStats(w);ls.textContent=st.n+" words · about "+st.sec+" sec"}w.follow=wkpFollow(P(),w);const lf=document.querySelector("[data-live-follow]");if(lf)lf.textContent=w.follow}
  if(route()==="outreach"&&k!=="note"){w.note=wkoNote(w);const ln=document.querySelector("[data-live-note]");if(ln)ln.textContent=w.note;const c=document.querySelector('[data-live-count="notelen"]');if(c){c.textContent=w.note.length+"/300";c.classList.toggle("over",w.note.length>300)}}});
document.addEventListener("input",e=>{const el=e.target;if(!F||!el.dataset||!el.dataset.bind)return;const path=el.dataset.bind.split(".");if(path.length===1)F.a[path[0]]=el.value;else{const o=F.a[path[0]]||(F.a[path[0]]={});o[path[1]]=el.value}});
document.addEventListener("change",e=>{const el=e.target;if(!F||!el.dataset||!el.dataset.bind)return;const path=el.dataset.bind.split(".");if(path.length===1)F.a[path[0]]=el.value;else{const o=F.a[path[0]]||(F.a[path[0]]={});o[path[1]]=el.value}});
document.addEventListener("scroll",e=>{const t=e.target;if(t&&t.classList&&t.classList.contains("wk-car-track"))wkCarSync(t)},true);
document.addEventListener("submit",e=>{const f=e.target.closest("[data-auth]");if(f){e.preventDefault();authSubmit(f)}});
document.addEventListener("keydown",e=>{if(WKS[route()]&&(e.key==="ArrowRight"||e.key==="ArrowLeft")&&!(e.target.matches&&e.target.matches("input,textarea"))){e.preventDefault();wkGo(e.key==="ArrowRight"?1:-1);return}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches&&e.target.matches("input.input")&&F){if(e.target.id==="hyp-input")return;e.preventDefault();ACT.next()}else if(e.key==="Enter"&&e.target.id==="hyp-input"){e.preventDefault();ACT.hyp()}});
onRoute();
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CLOCKED</title>
<meta name="theme-color" content="#0A0A0B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CLOCKED">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="The internship quiz that tells you the truth. Get your archetype, your clarity score, and the careers you're actually built for.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap">
<style>
:root{
  --bg:#0B0B0C;--ink:#F2F0EC;--mute:rgba(242,240,236,.55);--faint:rgba(242,240,236,.32);
  --glass:rgba(255,255,255,.05);--glass2:rgba(255,255,255,.085);--edge:rgba(255,255,255,.08);
  --a1:#FF7A45;--a2:#F0508A;--a3:#8F6BFF;
  --sans:"Inter Tight",system-ui,-apple-system,sans-serif;--ease:cubic-bezier(.22,.8,.24,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}

/* soft ambient glow, fixed so it never jumps between screens */
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.amb i{position:absolute;border-radius:50%;filter:blur(90px);animation:drift 24s ease-in-out infinite alternate}
.amb i:nth-child(1){width:75vmax;height:75vmax;left:-30vmax;top:-40vmax;background:radial-gradient(circle,var(--a1),transparent 62%);opacity:.32}
.amb i:nth-child(2){width:65vmax;height:65vmax;right:-32vmax;top:12vh;background:radial-gradient(circle,var(--a2),transparent 62%);opacity:.2;animation-delay:-8s}
.amb i:nth-child(3){width:65vmax;height:65vmax;left:-12vmax;bottom:-48vmax;background:radial-gradient(circle,var(--a3),transparent 62%);opacity:.2;animation-delay:-16s}
@keyframes drift{to{transform:translate(3vmax,2vmax) scale(1.06)}}
.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 4px;max-width:580px;width:100%;margin:0 auto}
.word{font-weight:500;font-size:20px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.mark{width:20px;height:20px;opacity:.9}
.circ{width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid var(--edge);display:grid;place-items:center;font-size:16px;overflow:hidden;flex:none;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:background .3s var(--ease)}
.circ:hover{background:var(--glass2)}
.circ img{width:100%;height:100%;object-fit:cover}
.chipc{padding:7px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);font-size:13px;font-variant-numeric:tabular-nums;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}

/* layout */
.screen{flex:1;width:100%;max-width:560px;margin:0 auto;padding:10px 22px 130px;display:flex;flex-direction:column}
.center{justify-content:center;align-items:center;text-align:center}
.has-tabs .screen{padding-bottom:150px}
.anim-in{animation:fade .6s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* type */
.ttl{font-weight:500;font-size:22px;line-height:1.2;letter-spacing:-.03em;margin:10px 0 0}
.ttl span{display:block;color:var(--mute);font-weight:400}
.kick{font-size:13px;color:var(--mute);margin:0 0 12px}
.t1{font-weight:400;font-size:clamp(34px,8.6vw,48px);line-height:1.08;letter-spacing:-.035em;margin:0 0 14px}
.t1 b{font-weight:600}
.t2{font-size:16.5px;color:var(--mute);margin:0 0 30px;max-width:34ch}
.cap{font-size:13px;color:var(--mute);margin:0 0 16px;text-align:center}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 0 18px}
.pills span{font-size:12.5px;padding:6px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);color:var(--mute)}

/* buttons */
.stack{display:flex;flex-direction:column;gap:10px;width:100%;max-width:370px;margin-left:auto;margin-right:auto}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:999px;padding:17px 22px;font-size:16px;font-weight:500;background:var(--ink);color:#0B0B0C;transition:transform .25s var(--ease),background .3s var(--ease),opacity .3s}
.btn:active{transform:scale(.985)}
.btn.glass{background:var(--glass);color:var(--ink);border:1px solid var(--edge);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.btn.glass:hover{background:var(--glass2)}
.btn[disabled]{opacity:.35;pointer-events:none}
.txt{background:none;border:0;padding:8px;color:var(--mute);font-size:14px;transition:color .3s}
.txt:hover{color:var(--ink)}

/* orb */
.orb{position:relative;width:min(56vw,232px);aspect-ratio:1;border-radius:50%;margin:8px auto 36px;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.6),transparent 30%),radial-gradient(circle at 70% 70%,var(--a3),transparent 62%),radial-gradient(circle at 28% 76%,var(--a2),transparent 58%),radial-gradient(circle at 62% 28%,var(--a1),transparent 62%),#2a1d2c;
  box-shadow:0 0 120px -20px var(--a2),inset 0 0 50px rgba(255,255,255,.18);animation:breathe 7s ease-in-out infinite}
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.12),transparent 40%);animation:spin 14s linear infinite;mix-blend-mode:overlay}
.orb.sm{width:110px;margin-bottom:26px}
.orb.busy{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.035);filter:saturate(1.1) brightness(1.05)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* score ring */
.ring{position:relative;width:min(66vw,250px);aspect-ratio:1;margin:14px auto 22px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .trk{fill:none;stroke:rgba(255,255,255,.07);stroke-width:9}
.ring .val{fill:none;stroke:url(#rg);stroke-width:9;stroke-linecap:round;filter:drop-shadow(0 0 10px rgba(240,80,138,.55));animation:ringin 1.8s var(--ease) both}
@keyframes ringin{from{stroke-dashoffset:var(--full)}}
.ring .glow{position:absolute;inset:16%;border-radius:50%;background:radial-gradient(circle,var(--a2),transparent 70%);opacity:.22;filter:blur(20px)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-weight:300;font-size:clamp(62px,16vw,84px);line-height:1;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.ring .num b small{font-size:.42em;letter-spacing:0;margin-left:2px;color:var(--mute)}
.ring .num span{font-size:12px;color:var(--mute);margin-top:6px}

/* tiles */
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.tl{position:relative;border-radius:24px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:15px 16px 17px;min-height:116px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;overflow:hidden;color:var(--ink);transition:background .3s var(--ease)}
a.tl:hover,button.tl:hover{background:var(--glass2)}
.tl.wide{grid-column:1/-1;min-height:96px}
.tl .h{font-size:13.5px;font-weight:500;color:var(--mute);display:flex;justify-content:space-between;gap:8px;position:relative;z-index:1}
.tl .h em{font-style:normal;font-weight:400;font-size:11px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.12);color:var(--ink)}
.tl .v{font-weight:300;font-size:36px;line-height:1;letter-spacing:-.04em;position:relative;z-index:1;font-variant-numeric:tabular-nums}
.tl .v.s{font-size:19px;font-weight:500;letter-spacing:-.02em;line-height:1.25}
.tl .d{font-size:13px;color:var(--mute);position:relative;z-index:1;line-height:1.5}
.tl .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(255,122,69,.55),rgba(240,80,138,.45));border-radius:24px 0 0 24px;animation:grow 1.4s .3s var(--ease) both}
@keyframes grow{from{width:0!important}}
.tl .bar{position:relative;z-index:1;height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.tl .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2));border-radius:2px;animation:grow 1.2s .4s var(--ease) both}
.tl.y{background:linear-gradient(135deg,rgba(255,122,69,.28),rgba(240,80,138,.22) 60%,rgba(143,107,255,.18));border-color:rgba(255,255,255,.12)}
.sech{font-weight:500;font-size:19px;letter-spacing:-.025em;margin:34px 0 12px;width:100%;text-align:left}
.sech span{color:var(--mute);font-weight:400}
.verdict{font-size:19px;line-height:1.35;letter-spacing:-.02em;margin:0 0 6px;text-align:center}
.verdict+.sub{color:var(--mute);margin:0 0 22px;text-align:center}
.steps{display:flex;flex-direction:column;gap:10px;width:100%}
.step{display:flex;gap:14px;align-items:flex-start;border-radius:24px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:15px 16px;text-align:left;width:100%;transition:opacity .4s var(--ease)}
.step .wk{font-size:11.5px;color:var(--faint);display:block;margin-bottom:3px}
.step b{display:block;font-weight:500;font-size:16px;line-height:1.3;letter-spacing:-.01em}
.step small{display:block;font-size:13px;color:var(--mute);margin-top:3px}
.step .ck{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--faint);margin-top:2px;display:grid;place-items:center;font-size:12px;color:#0B0B0C;background:transparent;transition:background .3s var(--ease)}
.step.done{opacity:.55}
.step.done .ck{background:var(--ink)!important;border-color:var(--ink)}
.step.done b{text-decoration:line-through}
.step .go2{margin-left:auto;align-self:center;font-size:12.5px;padding:7px 12px;border-radius:999px;background:var(--ink);color:#0B0B0C;border:0;flex:none}
.alt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 18px;font-size:15.5px}
.alt+.alt{border-top:1px solid var(--edge)}
.alt em{font-style:normal;color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums;text-align:right}
.gcard{border-radius:24px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);width:100%;text-align:left}

/* quiz */
.qbar{display:flex;gap:3px;max-width:516px;width:calc(100% - 44px);margin:6px auto 0}
.qbar i{flex:1;height:2px;border-radius:2px;background:rgba(255,255,255,.08);transition:background .5s var(--ease)}
.qbar i.on{background:rgba(242,240,236,.75)}
.qhead{display:flex;flex-direction:column;gap:10px;margin:18px 0 24px}
.qlabel{font-size:12.5px;color:var(--mute)}
.qq{font-weight:400;font-size:clamp(28px,7vw,38px);line-height:1.14;letter-spacing:-.03em;margin:0;text-wrap:balance}
.react{font-size:13.5px;margin:0;padding:7px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);color:var(--mute);align-self:flex-start;animation:fade .6s var(--ease) both}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles.one-col{grid-template-columns:1fr}
.tile{position:relative;text-align:left;border-radius:22px;border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:15px 17px 17px;min-height:90px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;font-size:16px;line-height:1.28;color:var(--ink);transition:background .35s var(--ease),color .35s var(--ease),box-shadow .45s var(--ease),transform .25s var(--ease),border-color .35s}
.tiles.one-col .tile{min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;padding:18px 20px}
.tile .k{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;transition:color .35s}
.tile:hover{background:var(--glass2)}
.tile:active{transform:scale(.985)}
.tile[aria-pressed="true"]{background:rgba(242,240,236,.94);color:#0B0B0C;border-color:transparent;box-shadow:0 0 36px -10px rgba(240,80,138,.7)}
.tile[aria-pressed="true"] .k{color:rgba(0,0,0,.4)}
.qtext{width:100%;min-height:130px;border-radius:22px;border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:var(--ink);font:inherit;font-size:18px;padding:18px;resize:none;transition:border-color .3s}
.qtext::placeholder{color:var(--faint)}
.qtext:focus{outline:none;border-color:rgba(255,255,255,.28)}
.pairs{display:flex;flex-direction:column;gap:10px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.pair>span{font-size:12px;color:var(--faint)}
.pair .tile{min-height:62px;justify-content:center;text-align:center;align-items:center;padding:14px}
.rate{display:flex;flex-direction:column;gap:10px}
.rate-row{border-radius:22px;border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:15px;display:flex;flex-direction:column;gap:12px}
.rate-row>b{font-weight:400;font-size:16px;line-height:1.35}
.rate-b{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rate-b button{border-radius:999px;border:1px solid var(--edge);background:transparent;padding:9px 4px;font-size:13px;color:var(--mute);transition:background .3s var(--ease),color .3s}
.rate-b button[aria-pressed="true"]{background:var(--ink);color:#0B0B0C;border-color:var(--ink)}
.qfoot{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:14px 22px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(11,11,12,.96) 50%,rgba(11,11,12,0))}
.qfoot .in{max-width:516px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.qfoot .cnt{font-size:13px;color:var(--mute)}
.go{display:flex;align-items:center;gap:12px;margin-left:auto;background:none;border:0;padding:0;font-size:15px;color:var(--mute);transition:opacity .4s var(--ease)}
.go i{width:56px;height:56px;border-radius:50%;background:var(--ink);color:#0B0B0C;display:grid;place-items:center;font-style:normal;font-size:20px;transition:transform .25s var(--ease)}
.go[disabled]{opacity:.28;pointer-events:none}
.go:active i{transform:scale(.94)}
.loadpill{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);font-size:13px;margin-bottom:12px}
.loadpill i{width:7px;height:7px;border-radius:50%;background:var(--ink);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.2}}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(11,11,12,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--edge);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.tabs .in{max-width:420px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--faint);padding:4px;transition:color .3s}
.tabs a svg{width:21px;height:21px}
.tabs a.on{color:var(--ink)}

/* forms */
.in{width:100%;border-radius:18px;border:1px solid var(--edge);background:var(--glass);color:var(--ink);padding:15px 17px;font:inherit;font-size:16px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:border-color .3s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:rgba(255,255,255,.28)}
textarea.in{min-height:120px;resize:vertical}
.msg{font-size:14px;line-height:1.5;padding:12px 16px;border-radius:18px;background:var(--glass);border:1px solid var(--edge);margin:0;text-align:left}
.msg.err{border-color:rgba(255,110,110,.45)}
details summary{list-style:none;cursor:pointer}details summary::-webkit-details-marker{display:none}
.drop{position:relative;width:min(58vw,212px);aspect-ratio:1;border-radius:50%;margin:0 auto 26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;border:1px dashed rgba(255,255,255,.22);background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.08),transparent 70%);cursor:pointer;transition:transform .4s var(--ease),border-color .3s}
.drop::before{content:"";position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,var(--a2),transparent 65%);opacity:.18;filter:blur(22px);z-index:-1}
.drop:hover,.drop.over{transform:scale(1.025);border-color:rgba(255,255,255,.5)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;border-radius:50%}
.drop b{font-weight:500;font-size:17px}
.drop span{font-size:13px;color:var(--mute)}
.drop.done{border-style:solid;border-color:rgba(255,255,255,.3)}
.found{text-align:left;width:100%}
.xp{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.xp .in{padding:12px 14px;font-size:15px}
.xp .rm{width:40px;height:40px;border-radius:50%;border:1px solid var(--edge);background:var(--glass)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.xp{grid-template-columns:1fr auto}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--edge);background:var(--glass);font-size:13px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#0B0B0C}
.tiny{font-size:12px;color:var(--faint)}
.help-fab{position:fixed;right:16px;bottom:16px;z-index:30;width:40px;height:40px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);color:var(--mute);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:15px}
.has-tabs~.help-fab,body:has(.has-tabs) .help-fab{bottom:88px}
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fade .4s var(--ease) both}
.modal{width:100%;max-width:440px;background:#151517;border:1px solid var(--edge);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:12px}
.modal h2{font-weight:400;font-size:26px;letter-spacing:-.03em;margin:0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:#1c1c1f;border:1px solid var(--edge);color:var(--ink);font-size:14px;padding:12px 18px;border-radius:999px;animation:fade .4s var(--ease) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.still .anim-in,.still .ring .val,.still .tl .fill,.still .tl .bar i,.still .react{animation:none}

/* v5: hook, resume read-out, gap reveal, plan */
.how3{list-style:none;margin:-8px 0 28px;padding:0;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.how3 li{display:flex;align-items:center;gap:8px;padding:7px 13px 7px 7px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);font-size:13px;color:var(--mute)}
.how3 b{width:20px;height:20px;border-radius:50%;background:var(--ink);color:#0B0B0C;display:grid;place-items:center;font-size:11px;font-weight:600}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;text-align:left}
.sw:has(.sw-col:only-child){grid-template-columns:1fr}
@media (max-width:520px){.sw{grid-template-columns:1fr}}
.sw-col{border-radius:24px;background:var(--glass);border:1px solid var(--edge);padding:14px 16px;display:flex;flex-direction:column;gap:12px;animation:fade .6s var(--ease) both}
.sw-col+.sw-col{animation-delay:.15s}
.sw-col h3{margin:0;font-size:12.5px;font-weight:500;color:var(--mute)}
.swi{display:flex;gap:12px;align-items:flex-start}
.swi b{display:block;font-weight:500;font-size:15px;line-height:1.3}

      <div class="tl"><div class="h">Where you are</div><div class="v s">${STAGE[R.stage].n}</div><div class="d">Stage ${R.stage} of 5</div></div>
      ${self!=null?`<div class="tl"><div class="h">You vs reality</div><div class="v s">${self}% → ${R.score}%</div><div class="d">${self-R.score>=15?"You overrate yourself":self-R.score<=-10?"You undersell yourself":"Pretty accurate"}</div></div>`:`<div class="tl"><div class="h">Weakest</div><div class="v s">${R.weak.n}</div></div>`}
      ${days!=null?`<div class="tl"><div class="h">${days>0?"Days to apply":"Apply"}</div><div class="v${days>0?"":" s"}">${days>0?days:"Now"}</div></div>`:""}
      ${c1?`<a class="tl" href="#r-career"><div class="h">Top match</div><div><div class="v">${rc.top[0].pct}%</div><div class="d">${esc(c1.t)}</div></div></a>`:`<button class="tl" data-act="begin" data-k="career"><div class="h">Career match</div><div class="v s">Find yours →</div></button>`}
    </div>
  </main>`,{tabs:"me"})}

function vResCareer(){const r=S.results.career;if(!r)return go("home"),"";const M=r.top.map(x=>Object.assign({},x,{d:DIRS.find(d=>d.id===x.id)})).filter(x=>x.d),m1=M[0],rest=M.slice(1,UI.more?6:3),pick=(S.profile||{}).target;
  const why=x=>[x.loves.length?"You’d love to "+listJoin(x.loves)+".":"",x.rb?"Your resume backs it up.":""].filter(Boolean).join(" ")||(x.likes.length?"You’re into "+listJoin(x.likes)+".":"");
  return shell(`<main class="screen anim-in">
    <p class="kick" style="text-align:center;margin-top:8px">Your top match</p>
    ${ring(m1.pct,"match")}
    <p class="verdict">You’re built for ${esc(m1.d.t.toLowerCase())}.</p><p class="sub">Search for “${esc(m1.d.role)}”</p>
    <div class="tiles2">
      <div class="tl wide y"><div class="h">Why it fits<em>#1</em></div><div class="d" style="color:var(--ink);font-size:15px">${esc(why(m1))}</div></div>
      ${rest.map((x,i)=>`<div class="tl${rest.length%2&&i===rest.length-1?" wide":""}"><div class="h">${esc(x.d.t)}.</div><div><div class="v">${x.pct}%</div><div class="bar" style="margin-top:10px"><i style="width:${x.pct}%"></i></div></div></div>`).join("")}
    </div>
    ${UI.more?"":`<button class="txt" data-act="more" style="align-self:flex-start">Show more</button>`}
    <div class="stack" style="margin:22px auto 0"><button class="btn${pick===m1.d.id?" glass":""}" data-act="pickdir" data-v="${m1.d.id}">${pick===m1.d.id?"Saved as your target":"Make "+esc(m1.d.t.toLowerCase())+" my target"}</button>
      ${S.results.arch?`<a class="btn glass" href="#me">Go to my dashboard</a>`:`<button class="btn glass" data-act="begin" data-k="arch">Get my readiness score</button>`}
      <button class="txt" data-act="begin" data-k="career">Retake</button></div>
  </main>`,{tabs:"me"})}

/* ---------- help ---------- */
const HELP_TYPES=[["bug","Something’s broken"],["idea","I have an idea"],["help","I need help"],["other","Other"]];
function helpUI(){if(!UI.help)return `<button class="help-fab" data-act="help" aria-label="Help and feedback">?</button>`;const h=UI.help;
  if(h.sent)return `<div class="modal-bg" data-act="helpx"><div class="modal"><h2>Got it.</h2><p class="t2" style="margin:0">Your message was sent. We read every one.</p><button class="btn" data-act="helpx">Done</button></div></div>`;
  return `<div class="modal-bg" data-act="helpx"><div class="modal" role="dialog" aria-modal="true"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Talk to us</h2><button class="circ" data-act="helpx" aria-label="Close">×</button></div>
    <div class="chips">${HELP_TYPES.map(([v,l])=>`<button class="chip" data-act="helptype" data-v="${v}" aria-pressed="${h.type===v}">${l}</button>`).join("")}</div>
    <textarea class="in" id="help-msg" placeholder="Write your message…">${esc(h.msg||"")}</textarea><input class="in" id="help-email" type="email" value="${esc(h.email||(AUTH.user&&AUTH.user.email)||"")}" placeholder="Your email (so we can reply)">
    ${h.err?`<p class="msg err">${esc(h.err)}</p>`:""}<button class="btn" data-act="helpsend" ${h.busy?"disabled":""}>${h.busy?"Sending…":"Send"}</button></div></div>`}
async function helpSend(){const h=UI.help;h.msg=($("#help-msg").value||"").trim();h.email=($("#help-email").value||"").trim();if(!h.msg){h.err="Write a quick message first.";render();return}
  h.busy=true;h.err="";render();let ok=false;
  if(sb){try{const {error}=await sb.from("feedback").insert({kind:h.type||"other",message:h.msg,email:h.email||null,page:route(),user_id:AUTH.user?AUTH.user.id:null,agent:navigator.userAgent.slice(0,200)});ok=!error}catch(e){}}
  h.busy=false;if(ok){h.sent=true;render();return}location.href="mailto:ameliamkopp@gmail.com?subject="+encodeURIComponent("CLOCKED feedback")+"&body="+encodeURIComponent(h.msg);h.sent=true;render()}

/* ---------- render ---------- */
function render(){const r=route();let html;
  if(UI.loading)html=vLoading(UI.loading);
  else if(r==="auth")html=shell(`<main class="screen center"><div class="orb busy"></div><span class="loadpill"><i></i>Logging you in</span></main>`,{bare:true});
  else if(r==="join")html=vJoin();else if(r==="setup")html=vSetup();
  else if(r==="q-arch"||r==="q-career")html=vQuiz(r.slice(2));
  else if(r==="r-arch")html=vResArch();else if(r==="r-career")html=vResCareer();
  else if(r==="me")html=vMe();else if(r==="steps")html=vSteps();else html=vHome();
  const vk=UI.loading?"load":r+(r.startsWith("q-")&&S.draft[r.slice(2)]?":"+S.draft[r.slice(2)].i:"");document.body.classList.toggle("still",UI.lastView===vk);UI.lastView=vk;
  const ae=document.activeElement,keep=ae&&ae.id&&/^(pf-|qz-text|au-|help-|paste)/.test(ae.id)?[ae.id,ae.selectionStart]:null;
  $("#app").innerHTML=html+((r==="home"&&!UI.loading)||UI.help?helpUI():"")+(UI.toast?`<div class="toast" role="status">${esc(UI.toast)}</div>`:"");
  if(keep){const el=document.getElementById(keep[0]);if(el){el.focus();try{el.setSelectionRange(keep[1],keep[1])}catch(e){}}}}

/* ---------- events ---------- */
const ACT={
  begin:el=>{const k=el.dataset.k;if(k==="arch"&&!(S.profile&&S.profile.done)){S.pending="q-arch";save();go("setup");return}startQuiz(k)},
  toquizzes:(el,e)=>{if(route()==="home"){e.preventDefault();const q=$("#quizzes");if(q)q.scrollIntoView({behavior:"smooth"})}else{e.preventDefault();go("home");setTimeout(()=>{const q=$("#quizzes");if(q)q.scrollIntoView()},50)}},
  authmode:()=>{UI.mode=UI.mode==="signup"?"login":"signup";UI.msg="";render()},
  guest:()=>{S.guest=true;const n=S.pending||"q-arch";S.pending=null;save();startQuiz(n.slice(2))},
  addxp:()=>{const p=S.profile;(p.experience||(p.experience=[])).push({title:"",company:"",dates:""});save();render()},
  rmxp:el=>{S.profile.experience.splice(+el.dataset.i,1);save();render()},
  pasteres:()=>{const t=($("#paste-res").value||"").trim();if(t.length<30){UI.parse={err:"Paste a bit more of your resume."};render();return}applyResume(parseResume(t.split(/\n+/).map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean)),"Pasted text");render()},
  setupdone:()=>{const p=S.profile||(S.profile={});if(!p.resume)p.noResume=true;if(p.name)p.first=p.name.split(" ")[0];p.done=true;
    if(p.grad&&!(S.draft.arch&&S.draft.arch.stack.length)){const y=+p.grad-YEAR;S.draft.arch={i:0,a:{c_stage:y<=0?"grad":y===1?"senior":y===2?"junior":"early"},stack:[]}}
    const n=S.pending||"q-arch";S.pending=null;save();startQuiz(n.slice(2))},
  one:el=>{const k=route().slice(2),d=S.draft[k],q=QUIZ[k].qs[d.i],pid=el.dataset.pid||q.id,part=q.kind==="combo"?q.parts.find(x=>x.id===pid):q;d.a[pid]=el.dataset.v;save();render()},
  many:el=>{const k=route().slice(2),d=S.draft[k],q=QUIZ[k].qs[d.i],pid=el.dataset.pid||q.id,part=q.kind==="combo"?q.parts.find(x=>x.id===pid):q;const a=Array.isArray(d.a[pid])?d.a[pid]:(d.a[pid]=[]),v=el.dataset.v,j=a.indexOf(v);if(j>=0)a.splice(j,1);else{a.push(v);if(part.max&&a.length>part.max)a.shift()}save();render()},
  pair:el=>{const k=route().slice(2),d=S.draft[k],q=QUIZ[k].qs[d.i],pid=el.dataset.pid||q.id,part=q.kind==="combo"?q.parts.find(x=>x.id===pid):q;const c=d.a[pid]||(d.a[pid]={});c[el.dataset.p]=el.dataset.v;save();render()},
  rate:el=>{const k=route().slice(2),d=S.draft[k],q=QUIZ[k].qs[d.i],cur=d.a[q.id]||(d.a[q.id]={});cur[el.dataset.t]=el.dataset.v;save();render()},
  qnext:()=>{const k=route().slice(2);qNext(k)},
  qback:()=>{const k=route().slice(2);qBack(k)},
  qexit:()=>go(S.profile&&S.profile.done?"me":"home"),
  pickdir:el=>{const p=S.profile||(S.profile={});p.target=el.dataset.v;save();toast("Saved as your target.");render()},
  more:()=>{UI.more=true;render()},
  edit:()=>{UI.edit=true;render()},
  tick:el=>{const d=S.stepsDone||(S.stepsDone={}),k=el.dataset.k;d[k]=!d[k];UI.openArea=k.split(":")[0];save();render()},
  logout:async()=>{if(sb)await sb.auth.signOut();AUTH.user=null;S=fresh();save();go("home")},
  help:()=>{UI.help={};render()},helpx:(el,e)=>{if(el.classList.contains("modal-bg")&&e.target!==el)return;UI.help=null;render()},
  helptype:el=>{UI.help.type=el.dataset.v;UI.help.msg=($("#help-msg")||{}).value||"";render()},helpsend:()=>helpSend(),
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const f=ACT[el.dataset.act];if(f){if(el.tagName==="A"&&el.dataset.act!=="toquizzes")e.preventDefault();f(el,e)}});
document.addEventListener("submit",e=>{if(e.target.matches("[data-auth]")){e.preventDefault();emailAuth(e.target)}});
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.pf){S.profile=S.profile||{};S.profile[t.dataset.pf]=t.value;save()}
  else if(t.dataset.xp!=null){S.profile.experience[+t.dataset.xp][t.dataset.f]=t.value;save()}
  else if(t.matches("[data-qtext]")){const k=route().slice(2),d=S.draft[k],q=QUIZ[k].qs[d.i];d.a[t.dataset.pid||q.id]=t.value;save();footSync(k)}});
document.addEventListener("input",e=>{if(e.target.matches("[data-slider]")){const k=route().slice(2),d=S.draft[k],q=QUIZ[k].qs[d.i],v=+e.target.value;d.a[e.target.dataset.pid||q.id]=v;save();$("#sl-n").textContent=v;$("#sl-l").textContent=selfLabel(v);footSync(k)}});
function footSync(k){const d=S.draft[k],q=QUIZ[k].qs[d.i],ok=qOk(q,d.a),b=$(".qz-foot .go");if(!b)return;const last=qVisible(k,d.a).indexOf(q)===qVisible(k,d.a).length-1;b.disabled=!ok&&!q.optional;b.innerHTML=(!ok&&q.optional?"Skip":last?"Show me the truth":"Next")+"<i>→</i>"}
document.addEventListener("change",e=>{if(e.target.matches("[data-resume]"))handleResume(e.target.files[0])});
document.addEventListener("dragover",e=>{const d=e.target.closest&&e.target.closest(".drop");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",e=>{const d=e.target.closest&&e.target.closest(".drop");if(d)d.classList.remove("over")});
document.addEventListener("drop",e=>{const d=e.target.closest&&e.target.closest(".drop");if(d){e.preventDefault();d.classList.remove("over");handleResume(e.dataTransfer.files[0])}});
document.addEventListener("keydown",e=>{if(!route().startsWith("q-")||/TEXTAREA|INPUT/.test(document.activeElement.tagName))return;if(e.key==="Enter"){const b=$(".qz-foot .go");if(b&&!b.disabled)b.click()}
  const n="abcdef".indexOf(e.key.toLowerCase());if(n>=0){const t=document.querySelectorAll(".tiles .tile")[n];if(t)t.click()}});
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
</script>
</body>
